2, "explanation": "Discussion follows initial organisation.", "page": 51, "topic": "Affinity process", "unit": 3, "id": "U3-155"}, {"q": "What does a quickly filling cluster suggest?", "options": ["An automatic winner", "An area to delete", "No project constraints", "Rich thinking in that area"], "answer": 3, "explanation": "Density signals attention, not automatic superiority.", "page": 51, "topic": "Affinity process", "unit": 3, "id": "U3-156"}, {"q": "How should a sparse cluster initially be treated?", "options": ["Explore the neglected area", "Delete it automatically", "Choose it as best automatically", "Assume users do not need it"], "answer": 0, "explanation": "Sparse areas may hide opportunities.", "page": 51, "topic": "Affinity process", "unit": 3, "id": "U3-157"}, {"q": "What assumption did Zerodha's case challenge?", "options": ["Every customer wants higher fees", "Brokerage must be a percentage of trades", "Education cannot be online", "Software cannot serve customers"], "answer": 1, "explanation": "The reframe questions percentage pricing.", "page": 52, "topic": "Zerodha case", "unit": 3, "id": "U3-158"}, {"q": "Which pricing question changes the frame?", "options": ["What percentage should we charge?", "How can we raise our percentage?", "Why use percentage pricing at all?", "Which percentage do rivals charge?"], "answer": 2, "explanation": "It challenges the model instead of optimising within it.", "page": 52, "topic": "Zerodha case", "unit": 3, "id": "U3-159"}, {"q": "Software instead of salespeople supported what in the case?", "options": ["A manager for each customer", "Higher fees on larger trades", "Avoiding education", "Low incremental cost per additional customer"], "answer": 3, "explanation": "An in-house platform reduced the cost of additional customers.", "page": 53, "topic": "Zerodha case", "unit": 3, "id": "U3-160"}, {"q": "What role did free education play in the case?", "options": ["Growing the market", "Replacing trading functions", "Increasing percentage fees", "Reducing understanding"], "answer": 0, "explanation": "Education expanded the potential market.", "page": 53, "topic": "Zerodha case", "unit": 3, "id": "U3-161"}, {"q": "What is Zerodha's central ideation lesson?", "options": ["Preserve every industry assumption", "Better questions can beat more answers", "Design only for wealthy clients", "Divergence means colour changes"], "answer": 1, "explanation": "Questioning assumptions opens new possibilities.", "page": 53, "topic": "Zerodha case", "unit": 3, "id": "U3-162"}, {"q": "What does feasibility ask?", "options": ["Is the logo fashionable?", "How many ideas exist?", "Can we build or implement it?", "Which slogan is most original?"], "answer": 2, "explanation": "Feasibility concerns implementation practicality.", "page": 54, "topic": "Feasibility", "unit": 3, "id": "U3-163"}, {"q": "What does relevance ask?", "options": ["Can we write more code?", "Is it most expensive?", "How many features can we add?", "Does it solve the user's problem?"], "answer": 3, "explanation": "Relevance concerns a genuine user pain point.", "page": 54, "topic": "Relevance", "unit": 3, "id": "U3-164"}, {"q": "Which feasibility concerns available technology?", "options": ["Technical", "Economic", "Schedule", "Legal"], "answer": 0, "explanation": "Technical feasibility assesses technological support.", "page": 54, "topic": "Feasibility types", "unit": 3, "id": "U3-165"}, {"q": "Which feasibility concerns affordability?", "options": ["Operational", "Economic", "Schedule", "Legal"], "answer": 1, "explanation": "Economic feasibility asks whether the organisation can afford it.", "page": 54, "topic": "Feasibility types", "unit": 3, "id": "U3-166"}, {"q": "Which feasibility concerns user acceptance?", "options": ["Economic", "Schedule", "Operational", "Technical"], "answer": 2, "explanation": "The unit places acceptance under operational feasibility.", "page": 54, "topic": "Feasibility types", "unit": 3, "id": "U3-167"}, {"q": "Which feasibility concerns regulatory compliance?", "options": ["Operational", "Economic", "Schedule", "Legal"], "answer": 3, "explanation": "Legal feasibility checks regulations.", "page": 54, "topic": "Feasibility types", "unit": 3, "id": "U3-168"}, {"q": "Which feasibility concerns completion in three months?", "options": ["Schedule", "Operational", "Legal", "Economic"], "answer": 0, "explanation": "Schedule feasibility assesses time limits.", "page": 54, "topic": "Feasibility types", "unit": 3, "id": "U3-169"}, {"q": "Where does high relevance and high feasibility belong?", "options": ["Consider", "Prioritise", "Avoid", "Quick wins"], "answer": 1, "explanation": "Both dimensions being high merits priority.", "page": 55, "topic": "Relevance-feasibility matrix", "unit": 3, "id": "U3-170"}, {"q": "Where does high relevance and low feasibility belong?", "options": ["Prioritise", "Avoid", "Consider", "Quick wins"], "answer": 2, "explanation": "The unit labels this quadrant Consider.", "page": 55, "topic": "Relevance-feasibility matrix", "unit": 3, "id": "U3-171"}, {"q": "Which ideas are Quick wins in the unit's relevance-feasibility matrix?", "options": ["High relevance, low feasibility", "Low relevance, low feasibility", "High relevance, high feasibility", "Low relevance, high feasibility"], "answer": 3, "explanation": "The unit uses this label for feasible but less relevant ideas.", "page": 55, "topic": "Relevance-feasibility matrix", "unit": 3, "id": "U3-172"}, {"q": "Which relevance-feasibility pair belongs in Avoid?", "options": ["Low relevance, low feasibility", "High relevance, low feasibility", "High relevance, high feasibility", "Low relevance, high feasibility"], "answer": 0, "explanation": "Weakness on both dimensions leads to Avoid.", "page": 55, "topic": "Relevance-feasibility matrix", "unit": 3, "id": "U3-173"}, {"q": "Why move from 2x2 screening to weighted scoring?", "options": ["Remove judgment permanently", "Make decisions more defensible", "Avoid agreeing on priorities", "Guarantee the favourite wins"], "answer": 1, "explanation": "Weighted criteria make the rationale explicit.", "page": 56, "topic": "Weighted scoring", "unit": 3, "id": "U3-174"}, {"q": "When should criterion weights be agreed?", "options": ["After seeing the winner", "After launch", "Before scoring", "After discarding alternatives"], "answer": 2, "explanation": "Prior agreement defines what best means.", "page": 56, "topic": "Weighted scoring", "unit": 3, "id": "U3-175"}, {"q": "What is the sum of weights 3, 2, 1, 2, 1?", "options": ["8", "10", "11", "9"], "answer": 3, "explanation": "Adding the five weights gives 9.", "page": 56, "topic": "Weighted calculations", "unit": 3, "id": "U3-176"}, {"q": "With weights 3, 2, 1, 2, 1 and all scores 4, what is the total?", "options": ["36", "20", "32", "40"], "answer": 0, "explanation": "Four times the weight sum 9 equals 36.", "page": 56, "topic": "Weighted calculations", "unit": 3, "id": "U3-177"}, {"q": "With weights 3, 2, 1, 2, 1, what total do scores 5, 4, 3, 2, 4 give?", "options": ["30", "34", "36", "38"], "answer": 1, "explanation": "15+8+3+4+4 equals 34.", "page": 56, "topic": "Weighted calculations", "unit": 3, "id": "U3-178"}, {"q": "With user value weighted 3, increasing its score from 3 to 5 adds what?", "options": ["2", "3", "6", "15"], "answer": 2, "explanation": "The two-point increase multiplied by 3 adds 6.", "page": 56, "topic": "Weighted calculations", "unit": 3, "id": "U3-179"}, {"q": "Feasibility weight is 2 and novelty weight 1. Which one-point increase adds more?", "options": ["Novelty", "They add equally", "Neither changes the total", "Feasibility"], "answer": 3, "explanation": "One feasibility point adds 2 rather than 1.", "page": 56, "topic": "Weighted calculations", "unit": 3, "id": "U3-180"}, {"q": "With weights 3, 2, 1, 2, 1 and maximum scores 5, what is the maximum total?", "options": ["45", "25", "40", "50"], "answer": 0, "explanation": "The weight sum 9 multiplied by 5 equals 45.", "page": 56, "topic": "Weighted calculations", "unit": 3, "id": "U3-181"}, {"q": "Using weights 20%, 25%, 20%, 20%, 15%, what is the correct average for A scores 4, 5, 4, 5, 4?", "options": ["4.55", "4.45", "4.05", "4.20"], "answer": 1, "explanation": "0.8+1.25+0.8+1+0.6=4.45; the printed total is inconsistent.", "page": 57, "topic": "Weighted calculations", "unit": 3, "id": "U3-182"}, {"q": "Using weights 20%, 25%, 20%, 20%, 15%, what is the correct average for B scores 3, 4, 5, 4, 3?", "options": ["4.05", "4.20", "3.85", "4.45"], "answer": 2, "explanation": "0.6+1+1+0.8+0.45=3.85; the printed total is inconsistent.", "page": 57, "topic": "Weighted calculations", "unit": 3, "id": "U3-183"}, {"q": "Using weights 20%, 25%, 20%, 20%, 15%, what is the correct average for C scores 5, 3, 3, 5, 4?", "options": ["4.20", "4.05", "4.45", "3.95"], "answer": 3, "explanation": "1+0.75+0.6+1+0.6=3.95; the printed total is inconsistent.", "page": 57, "topic": "Weighted calculations", "unit": 3, "id": "U3-184"}, {"q": "Which idea wins after correctly recalculating page 57's displayed scores?", "options": ["Idea A", "Idea B", "Idea C", "All tie"], "answer": 0, "explanation": "The averages are A 4.45, B 3.85, C 3.95.", "page": 57, "topic": "Weighted calculations", "unit": 3, "id": "U3-185"}, {"q": "Why can changing weights change the winner?", "options": ["Weights automatically change the problem", "Weights express relative criterion importance", "Weights remove score differences", "Weights guarantee novelty wins"], "answer": 1, "explanation": "Different priorities may produce different rankings.", "page": 57, "topic": "Weighted scoring", "unit": 3, "id": "U3-186"}, {"q": "What distinguishes selection from prioritisation?", "options": ["Selection generates; prioritisation researches", "Selection sketches; prioritisation interviews", "Selection chooses; prioritisation ranks", "Selection clusters; prioritisation removes criteria"], "answer": 2, "explanation": "Selection chooses a suitable idea, while prioritisation orders ideas.", "page": 58, "topic": "Prioritisation", "unit": 3, "id": "U3-187"}, {"q": "Which criterion checks fit with mission and goals?", "options": ["Novelty alone", "Technical complexity alone", "Idea count", "Strategic alignment"], "answer": 3, "explanation": "Strategic alignment assesses organisational fit.", "page": 58, "topic": "Prioritisation", "unit": 3, "id": "U3-188"}, {"q": "Which impact-effort pair is top priority?", "options": ["High impact, low effort", "Low impact, high effort", "Low impact, low effort", "High impact, high effort"], "answer": 0, "explanation": "High impact at low effort merits immediate implementation.", "page": 59, "topic": "Impact-effort", "unit": 3, "id": "U3-189"}, {"q": "How are high-impact, high-effort ideas treated?", "options": ["Immediate low-effort wins", "Strategic long-term priorities", "Automatic rejection", "Optional low-priority extras"], "answer": 1, "explanation": "These are worthwhile but require substantial effort.", "page": 59, "topic": "Impact-effort", "unit": 3, "id": "U3-190"}, {"q": "Which impact-effort pair should be avoided?", "options": ["High impact, low effort", "Low impact, low effort", "Low impact, high effort", "High impact, high effort"], "answer": 2, "explanation": "Large effort for little impact belongs in Avoid.", "page": 59, "topic": "Impact-effort", "unit": 3, "id": "U3-191"}, {"q": "Which matrix schedules the shortlist according to the notes?", "options": ["Relevance-feasibility", "Mind-map hierarchy", "Idea count", "Impact-effort"], "answer": 3, "explanation": "Relevance-feasibility screens the long list; impact-effort schedules the shortlist.", "page": 59, "topic": "Matrix selection", "unit": 3, "id": "U3-192"}, {"q": "What is the Innovation Mission target?", "options": ["100 ideas over a week using varied techniques", "One product in eight minutes", "Eight identical sketches in a day", "Only one generation technique"], "answer": 0, "explanation": "The mission combines 100 ideas and different daily methods.", "page": 60, "topic": "Integrated ideation", "unit": 3, "id": "U3-193"}, {"q": "Why record each day's best idea?", "options": ["Prove highest count always means highest quality", "Compare quality across techniques as well as count", "Avoid later evaluation", "Remove technique variety"], "answer": 1, "explanation": "The reflection distinguishes idea quality from quantity.", "page": 60, "topic": "Integrated ideation", "unit": 3, "id": "U3-194"}, {"q": "What is the capstone's convergence sequence?", "options": ["Launch, then brainstorm", "Score, then clarify", "2x2 shortlist, then weighted decision", "Choose, then gather constraints"], "answer": 2, "explanation": "Coarse screening precedes a defensible weighted comparison.", "page": 61, "topic": "Integrated ideation", "unit": 3, "id": "U3-195"}, {"q": "What is the closing sequence of the unit?", "options": ["Decide, Diverge, Launch, Clarify", "Cluster, Launch, Guess, Ignore", "Evaluate, Reject, Stop, Forget", "Diverge, Cluster, Converge, Decide"], "answer": 3, "explanation": "The final slide summarises generation, organisation, evaluation, and decision.", "page": 63, "topic": "Integrated ideation", "unit": 3, "id": "U3-196"}, {"q": "Which priority is assigned to the AI Tutor example?", "options": ["High", "Medium", "Low", "Avoid"], "answer": 0, "explanation": "The unit's example ranks AI Tutor high for personalised learning and doubt solving.", "page": 58, "topic": "Prioritisation", "unit": 3, "id": "U3-197"}, {"q": "Which impact-effort ideas are optional if time allows?", "options": ["High impact, low effort", "Low impact, low effort", "High impact, high effort", "Low impact, high effort"], "answer": 1, "explanation": "The notes label low-impact, low-effort work low priority.", "page": 59, "topic": "Impact-effort", "unit": 3, "id": "U3-198"}, {"q": "Which capstone step comes immediately after divergence?", "options": ["Launch the product", "Ignore constraints", "Cluster ideas", "Repeat final selection"], "answer": 2, "explanation": "The capstone groups generated ideas before converging.", "page": 61, "topic": "Integrated ideation", "unit": 3, "id": "U3-199"}, {"q": "Which constraint example addresses human resources?", "options": ["A fixed budget", "Recyclable packaging", "A safety regulation", "Limited available staff"], "answer": 3, "explanation": "Human resources concern the people available to do the work.", "page": 21, "topic": "Constraints", "unit": 3, "id": "U3-200"}, {"q": "Which dimension measures the number of ideas produced?", "options": ["Fluency", "Flexibility", "Elaboration", "Feasibility"], "answer": 0, "explanation": "Fluency concerns the count of alternatives.", "page": 0, "topic": "Divergent quality", "source": "web", "unit": 3, "id": "U3-201"}, {"q": "Switching from digital to staffing to physical-layout ideas mainly increases what?", "options": ["Score precision", "Flexibility", "Operational cost", "Convergence speed"], "answer": 1, "explanation": "Flexibility is movement across categories.", "page": 0, "topic": "Divergent quality", "source": "web", "unit": 3, "id": "U3-202"}, {"q": "Adding a user, context and operating steps to a rough idea improves what?", "options": ["Sampling bias", "Idea elimination", "Elaboration", "Mandatory compliance"], "answer": 2, "explanation": "Elaboration develops an idea in useful detail.", "page": 0, "topic": "Divergent quality", "source": "web", "unit": 3, "id": "U3-203"}, {"q": "An uncommon but relevant concept demonstrates which dimension?", "options": ["Fluency alone", "Schedule feasibility", "Standardisation", "Originality"], "answer": 3, "explanation": "Originality concerns novelty with relevance.", "page": 0, "topic": "Divergent quality", "source": "web", "unit": 3, "id": "U3-204"}, {"q": "What does the first diamond primarily explore and narrow?", "options": ["The problem space", "Only the final software code", "The marketing budget alone", "Only the chosen solution"], "answer": 0, "explanation": "The first expansion and narrowing concern understanding and defining the problem.", "page": 0, "topic": "Double diamond", "source": "web", "unit": 3, "id": "U3-205"}, {"q": "Why start with independent written ideas before discussion?", "options": ["To guarantee consensus", "To reduce domination by vocal participants", "To remove every unusual idea", "To make seniority the selection criterion"], "answer": 1, "explanation": "Brainwriting allows contributions before group influence.", "page": 0, "topic": "Brainwriting", "source": "web", "unit": 3, "id": "U3-206"}, {"q": "Waiting to speak while someone else talks can inhibit group output through what?", "options": ["Technical feasibility", "Weighted scoring", "Production blocking", "Memory consolidation"], "answer": 2, "explanation": "Only one speaker at a time can prevent others recording or developing ideas.", "page": 0, "topic": "Brainstorming limitations", "source": "web", "unit": 3, "id": "U3-207"}, {"q": "An idea fails a mandatory safety gate but has a high total score. What should happen?", "options": ["Ignore the gate", "Increase its novelty rating", "Average safety with presentation quality", "Exclude or redesign it to satisfy the gate"], "answer": 3, "explanation": "A mandatory requirement cannot be compensated by unrelated strengths.", "page": 0, "topic": "Mandatory gates", "source": "web", "unit": 3, "id": "U3-208"}, {"q": "What does sensitivity analysis examine in a decision matrix?", "options": ["How rankings change with weights or assumptions", "Only the font size of the table", "The number of workshop chairs", "Only the order of idea submission"], "answer": 0, "explanation": "Varying weights tests how robust a ranking is.", "page": 0, "topic": "Matrix robustness", "source": "web", "unit": 3, "id": "U3-209"}, {"q": "Two concepts share a mean rating but one sharply divides reviewers. What should be examined?", "options": ["Only alphabetical order", "Reasons and distribution of the ratings", "Only the mean again", "Only the senior reviewer's preference"], "answer": 1, "explanation": "The same average can hide disagreement that merits investigation.", "page": 0, "topic": "Evaluation evidence", "source": "web", "unit": 3, "id": "U3-210"}, {"q": "What should happen to an unusual idea that fits no cluster?", "options": ["Delete it automatically", "Rewrite it to match a popular idea", "Keep it visible for further exploration", "Count it as a duplicate"], "answer": 2, "explanation": "Outliers may offer an original direction.", "page": 0, "topic": "Clustering outliers", "source": "web", "unit": 3, "id": "U3-211"}, {"q": "A concept supports two themes. What is a useful clustering practice?", "options": ["Discard one theme without discussion", "Ban cross-category ideas", "Select it automatically", "Show it in both and mark the connection"], "answer": 3, "explanation": "Multiple links can preserve the concept's meaning.", "page": 0, "topic": "Clustering connections", "source": "web", "unit": 3, "id": "U3-212"}, {"q": "A notification feature depends on a data integration. What should sequencing consider?", "options": ["Complete the enabling integration first", "Ignore dependencies", "Launch notifications without data", "Rank only by visual appeal"], "answer": 0, "explanation": "Dependencies constrain a feasible implementation order.", "page": 0, "topic": "Dependencies", "source": "web", "unit": 3, "id": "U3-213"}, {"q": "Why does a selected concept still need testing?", "options": ["A high matrix score proves adoption", "Its expected value remains a hypothesis", "Selection ends uncertainty", "All selected ideas are equally successful"], "answer": 1, "explanation": "Selection is a reasoned choice, not evidence of real-world success.", "page": 0, "topic": "Validation", "source": "web", "unit": 3, "id": "U3-214"}, {"q": "Which planning practice makes selected ideas actionable?", "options": ["Keep only a ranked list without actions", "Remove all decision dates", "Assign owners, resources and success measures", "Hide assumptions from the team"], "answer": 2, "explanation": "Ownership and explicit next steps turn ranking into action.", "page": 0, "topic": "Implementation planning", "source": "web", "unit": 3, "id": "U3-215"}], "concepts": [{"title": "Thinking modes", "body": "Focused thinking is concentrated, analytical, structured and sequential, using established pathways. Diffuse thinking is relaxed, associative, flexible and exploratory, supporting broader connections.", "page": 5, "source": "pdf", "unit": 1}, {"title": "Alternating modes", "body": "Effective problem solving alternates concentration with diffuse processing. Work first, then take a break or walk; relaxed processing reorganises previously encountered material. The Mendeleev dream anecdote illustrates incubation after effort. Track when, where and in what mental state ideas arrive.", "page": 6, "source": "pdf", "unit": 1}, {"title": "VARK preferences", "body": "VARK describes Visual (diagrams and images), Auditory (listening and discussion), Reading/Writing (books and notes), and Kinesthetic (hands-on experience) preferences. Activity scoring pairs V=1+5, A=2+6, R=3+7, K=4+8.", "page": 7, "source": "pdf", "unit": 1}, {"title": "Evidence about learning", "body": "VARK can prompt reflection but should not become a fixed identity or teaching rule. Controlled studies have not supported the stronger claim that matching teaching to preferred style improves outcomes. Retrieval practice, spacing and interleaving have replicated support. Popularity and stated preferences do not establish effectiveness.", "page": 8, "source": "pdf", "unit": 1}, {"title": "Functional fixedness", "body": "Functional fixedness restricts an object to its conventional role. Paper clips can also organise cables, pull zippers or mark pages. In the candle problem, the matchbox can support a candle rather than merely store matches. Generating non-obvious uses challenges fixed assumptions.", "page": 9, "source": "pdf", "unit": 1}, {"title": "Property technique", "body": "List properties instead of customary uses: hollow, watertight, rigid/strong, light/stackable, handled and sound-amplifying. Each opens uses such as a plant pot, emergency water store, stool, display riser, hanging planter or megaphone. Overlooked properties reveal overlooked functions.", "page": 10, "source": "pdf", "unit": 1}, {"title": "Cognitive blocks", "body": "Fear of failure suppresses ideas because of criticism; premature judgment rejects before exploration; conformity follows convention to fit in; the expertise trap overuses past solutions. Empathy, experimentation, collaboration and structured creativity counter these blocks.", "page": 11, "source": "pdf", "unit": 1}, {"title": "Creativity invention innovation", "body": "Creativity generates original and useful ideas; invention creates something new; innovation implements ideas successfully to create value. The course examples are imagining drone delivery, the first telephone, and the iPhone respectively. Novelty alone is insufficient for innovation.", "page": 12, "source": "pdf", "unit": 1}, {"title": "Incremental and disruptive change", "body": "The course describes incremental invention as small meaningful improvements, using USB Type-C, smartphones and hybrid cars. Its broad account of disruptive innovation stresses simpler, cheaper or more accessible solutions, unmet needs and market change; examples include Netflix, Uber and Airbnb.", "page": 13, "source": "pdf", "unit": 1}, {"title": "Problem types", "body": "Well-defined problems have clear goals, constraints and a correct answer. Ill-defined problems have unclear goals/paths and multiple solutions. Wicked problems are interconnected and complex, judged as better or worse. Equations, app design and poverty respectively illustrate them.", "page": 14, "source": "pdf", "unit": 1}, {"title": "Design Thinking principles", "body": "DT is human-centred and iterative, understanding user needs and experiences to develop practical solutions. Learn from the user perspective; improve ideas by testing; learn from early failure while it is relatively inexpensive. Curiosity, reflection, critical thinking and creative confidence support this mindset.", "page": 15, "source": "pdf", "unit": 1}, {"title": "History and Lawson", "body": "The course timeline links Rittel and design methods to the mid-1960s, Simon to 1969–70s, Cross and Rowe to 1982–87, IDEO to 1991, and d.school to 2005. Its account of Lawson contrasts problem-focused scientific analysis with solution-focused designers rapidly testing alternatives to learn.", "page": 16, "source": "pdf", "unit": 1}, {"title": "Stanford framework", "body": "Empathize understands needs; Define pinpoints the core problem; Ideate generates many ideas; Prototype builds simple models; Test evaluates and refines with users. This is an iterative process: test findings can change earlier understanding and the problem statement.", "page": 17, "source": "pdf", "unit": 1}, {"title": "IDEO lenses", "body": "Desirability asks whether people want a solution; feasibility asks whether it can be built; viability asks whether it is economically sustainable. Innovation requires all three in the course diagram. These lenses complement Stanford process stages rather than competing with them.", "page": 18, "source": "pdf", "unit": 1}, {"title": "Waterfall and HCD", "body": "In the course comparison, waterfall finishes phases sequentially with user feedback at the end, making changes costly. HCD uses empathy, prototypes, continuous feedback and refinement throughout an iterative process.", "page": 19, "source": "pdf", "unit": 1}, {"title": "Airbnb case", "body": "In the course 2009 case, low bookings and flat revenue showed what but not why. Host visits in New York revealed poor listing photographs. Founders photographed listings themselves and bookings improved. Direct observation informed a simple hands-on intervention and challenged assumptions about what needed changing.", "page": 20, "source": "pdf", "unit": 1}, {"title": "Google Glass case", "body": "The course attributes consumer Glass difficulties to recording concerns, conspicuous design, unclear use case and its $1,500 price. Technology alone did not ensure desirability. Its enterprise example serves technicians needing hands-free work: value depends on users and context, not technology in isolation.", "page": 21, "source": "pdf", "unit": 1}, {"title": "Aravind reframing", "body": "The course describes Dr. V founding Aravind in Madurai in 1976 with eleven beds. Cataract surgery already worked; cost, distance and scarce surgeons limited access. Studying the McDonald’s assembly line supplied analogous inspiration from an unrelated industry.", "page": 22, "source": "pdf", "unit": 1}, {"title": "Aravind approach", "body": "Two tables per surgeon reduce idle time; paramedical staff free doctors for surgery; cross-subsidy varies comfort, not surgical quality; Aurolab manufactures lenses locally; village outreach reduces travel barriers. The case links affordability to process design and dignity to equal surgery and surgeons. Its stated model is financially self-sustaining with many patients paying little or nothing.", "page": 23, "source": "pdf", "unit": 1}, {"title": "Recognising Design Thinking", "body": "Observe before choosing solutions; revise the problem when prototypes challenge assumptions; investigate the need beneath complaints. Choosing an app before research or selecting solely by technical architecture is solution-first, not sufficient evidence of human-centred inquiry.", "page": 24, "source": "pdf", "unit": 1}, {"title": "Observation and practice", "body": "Evaluate everyday objects, signs, queues, forms and interfaces by asking who uses them, who struggles and why. Analyse successes through solved needs and DT principles, failures through ignored principles and missing research. The mini sprint lists properties, empathizes, defines, sketches three versions and pitches. Notice → Question → Reframe → Create → Deliver Value.", "page": 25, "source": "pdf", "unit": 1}, {"title": "Applying foundational principles", "body": "The capstone combines property analysis, empathy, a one-line problem definition, three alternative sketches and a thirty-second pitch. Course foundations develop metacognition (awareness of thinking), self-awareness, creative confidence and critical thinking. A design evaluation should identify users and outcomes before celebrating novelty.", "page": 27, "source": "pdf", "unit": 1}, {"title": "Learning and cognition (web supplement)", "body": "Learning is a lasting change in knowledge, skill or behaviour. Encoding links material with prior knowledge; retrieval brings stored information back. Working memory has limited temporary capacity, while long-term memory includes organised schemas. Chunking groups elements into meaningful units. Neuroplasticity describes experience-related changes in the brain; sleep supports memory consolidation.", "page": 0, "source": "web", "unit": 1}, {"title": "Cognitive load (web supplement)", "body": "Intrinsic load comes from task complexity, extraneous load from unnecessary presentation demands, and germane effort supports schema building. Clear presentation can reduce avoidable load without removing the core learning challenge.", "page": 0, "source": "web", "unit": 1}, {"title": "Kolb and Bloom (web supplement)", "body": "Kolb cycles through concrete experience, reflective observation, abstract conceptualisation and active experimentation. Revised Bloom levels are Remember, Understand, Apply, Analyse, Evaluate and Create; they distinguish different cognitive demands.", "page": 0, "source": "web", "unit": 1}, {"title": "Additional design frameworks (web supplement)", "body": "IDEO process labels vary by source: the notes use Hear → Create → Deliver (context research; synthesis/co-design; operating and financial model), while the linked MCQ scope uses Inspiration → Ideation → Implementation. Both process variants are distinct from desirability, feasibility and viability lenses. Participatory design involves users as collaborators; HCI attends to interaction and affordances. Radical change is a substantial departure, unlike incremental improvement.", "page": 0, "source": "web", "unit": 1}, {"title": "Additional cases and barriers (web supplement)", "body": "Supplementary case lessons: M-Pesa builds on familiar phones and agents to improve access; Segway illustrates price, regulations and unclear-use-case barriers; New Coke illustrates overlooked emotional attachment; shopping-cart observation reveals use and safety needs. Authority bias overweights status; evaluation apprehension inhibits contributions through fear of judgment.", "page": 0, "source": "web", "unit": 1}, {"title": "Empathy", "page": 5, "body": "Understand users’ feelings, experiences, motivations, frustrations and goals from their point of view. Study what people think, feel, say and do to uncover hidden needs and solve actual problems.", "unit": 2}, {"title": "The empathy habit", "page": 6, "body": "See through users’ eyes, attend to their emotions and listen to their experiences. This reduces assumptions, reveals unreported problems, builds trust and supports meaningful solutions.", "unit": 2}, {"title": "Sympathy, empathy and compassion", "page": 7, "body": "Sympathy is feeling for someone from a distance. Empathy understands their experience. Compassion adds a decision to act on that understanding.", "unit": 2}, {"title": "You are not the user", "page": 8, "body": "Personal experience is one hypothesis, not a representative sample. Check assumptions with other users, including people whose experiences differ from yours.", "unit": 2}, {"title": "Computational empathy", "page": 9, "body": "Apply empathy to software that responds to human emotions and behaviour, often using AI. Examples include intent-sensitive chatbots, adaptive learning, recommendations and well-being monitoring.", "unit": 2}, {"title": "CoWIN and inclusive access", "page": 10, "body": "The case highlights varied devices, languages, connectivity, abilities and digital literacy. Self-service, helpdesk and on-site pathways shared a backend; QR certificates and third-party slot APIs supported access. Design for the least-connected user.", "unit": 2}, {"title": "User research", "page": 11, "body": "Investigate needs, behaviours, goals, challenges, expectations and motivations before creating solutions. Evidence replaces unsupported assumptions.", "unit": 2}, {"title": "Qualitative research", "page": 12, "body": "Explore why and how through interviews, observation and focus groups. Use contextual understanding, words, behaviour, emotions, small purposive samples and iterative interpretation. The 5–20 participants in the notes is illustrative, not a universal requirement.", "unit": 2}, {"title": "Quantitative research", "page": 12, "body": "Measure what and how many with surveys, analytics and A/B tests. Use numeric data, larger samples, statistics, standardisation, replication and deductive reasoning. The 100+ sample illustration is not a universal requirement. Discover qualitatively and validate quantitatively.", "unit": 2}, {"title": "Field observation", "page": 14, "body": "Observe actual behaviour in natural settings without interrupting or influencing it. Keep discreet factual notes. Studying a particular individual still requires consent.", "unit": 2}, {"title": "AEIOU", "page": 15, "body": "Organise observation into Activities (goal-directed tasks), Environment (physical or digital setting), Interactions (engagement with people/products/systems), Objects (tools and devices) and Users (individuals’ roles and characteristics).", "unit": 2}, {"title": "Activities", "page": 16, "body": "Record tasks, frequency, importance and steps to understand workflows and obstacles.", "unit": 2}, {"title": "Environment", "page": 17, "body": "Physical and digital space influences experience. Consider lighting, noise, temperature, space and technology.", "unit": 2}, {"title": "Interactions", "page": 18, "body": "Observe engagement with people, products and systems. Navigation difficulties, repeated questions and confusing layouts expose usability issues.", "unit": 2}, {"title": "Objects", "page": 19, "body": "Tools, devices and products include phones, laptops, books and applications. Their design influences task efficiency and effectiveness.", "unit": 2}, {"title": "Users", "page": 20, "body": "Study people’s roles and characteristics in context. Distinguish the device from its user and the goal being pursued.", "unit": 2}, {"title": "Photocopy-shop case", "page": 21, "body": "Record counts, queues, pricing questions, noise, a low rate card, shared print jobs and tools. Four of eleven people left after asking the price. “Badly managed” is a judgment; record evidence before interpreting causes.", "unit": 2}, {"title": "Research ethics", "page": 22, "body": "Get clear permission before interviews or individual study, identify yourself, use pseudonyms or initials, and sketch scenes rather than photographing people. Meet in public campus areas in daylight, preferably in pairs; avoid residential spaces.", "unit": 2}, {"title": "Consent script", "page": 23, "body": "Explain identity, project, topic, approximate duration and anonymous class-only notes. Participation is voluntary, with rights to stop and skip questions. Obtain agreement; consult a faculty mentor about unsuitable or uncertain sites.", "unit": 2}, {"title": "What–How–Why", "page": 24, "body": "What records factual actions; How studies the manner, effort and challenges; Why considers motivations, emotions and needs. Label inferred explanations explicitly. Interpretation without observation is guesswork.", "unit": 2}, {"title": "Food-delivery example", "page": 25, "body": "What: opening, browsing, adding items and hesitating. How: comparing, scrolling back, rereading fees and looking for promotions. Why: possible value/time concerns or uncertainty, which require careful interpretation.", "unit": 2}, {"title": "Good interview questions", "page": 28, "body": "Ask open, non-leading, exploratory questions about actual experiences and current workarounds rather than hypothetical adoption. Listen more than you talk (80/20); avoid defending your ideas.", "unit": 2}, {"title": "Seven interview techniques", "page": 29, "body": "Five Whys explores causes; tell me a story seeks a specific episode; show me invites demonstration; three-to-five-second silence encourages elaboration; follow emotions; seek contradictions curiously; use a grand tour for an entire routine.", "unit": 2}, {"title": "Unbiased interviewing", "page": 30, "body": "Let users speak freely, avoid leading wording and interruption, attend to body language and invite stories. Judgmental advice disguised as a question can damage openness.", "unit": 2}, {"title": "Five Whys library case", "page": 31, "body": "Crowding leads to noise, difficulty focusing, exam pressure, memorisation-heavy evaluation and frustration about wasted learning time. Reframe toward worthwhile study time rather than immediately building a bigger library.", "unit": 2}, {"title": "Explicit and implicit needs", "page": 33, "body": "Explicit needs are stated wants such as faster checkout or lower cost. Implicit needs are often unspoken, such as control, simplicity, confidence, safety and trust, and emerge through observation and analysis.", "unit": 2}, {"title": "Say–do gap", "page": 34, "body": "Reported preferences can differ from observed behaviour. In the coffee illustration, stated light-roast preferences differ from dark-roast choices. Investigate discrepancies without accusations.", "unit": 2}, {"title": "Pain points", "page": 35, "body": "Specific frustrations arise while pursuing goals. Process concerns procedures; financial concerns cost; support concerns missing help; productivity concerns wasted effort. Categories can overlap. Support each pain point with a quote or count.", "unit": 2}, {"title": "Namma Yatri case", "page": 36, "body": "Driver research exposed commission pressure, opaque algorithm changes and no appeal routes. The deeper pain was powerlessness, with a need for predictable, dignified incomes and control. The notes describe a zero-commission subscription pilot using open protocols. Study providers as well as consumers.", "unit": 2}, {"title": "Personas", "page": 38, "body": "A fictional individual profile must be grounded in real research. Include name, demographics, goals, frustrations, needs, behaviours and a real interview quote. Trace substantive claims to evidence; omit invented decoration.", "unit": 2}, {"title": "Archetypes", "page": 40, "body": "An archetype groups people with shared behaviour, characteristics and needs for segmentation. A persona makes a group concrete as an individual, supporting empathy.", "unit": 2}, {"title": "Empathy maps", "page": 41, "body": "Says contains direct statements; Thinks contains beliefs and concerns; Does contains observable actions; Feels contains emotions and attitudes. Gaps between statements and actions invite inquiry rather than automatic conclusions.", "unit": 2}, {"title": "Problem statements", "page": 43, "body": "Use [User] needs [need] because [insight]. Name the people, human need and reason while leaving solutions open. “We need a mobile app” prematurely specifies a solution.", "unit": 2}, {"title": "How Might We", "page": 44, "body": "Reframe problems as opportunities. The Goldilocks test rejects questions too broad to guide work or too narrow because they specify a solution. Aim for a bounded human need with multiple possible responses.", "unit": 2}, {"title": "Integrated pipeline", "page": 45, "body": "Observe with AEIOU and a count; get consent and interview; apply Five Whys; separate explicit/implicit needs; build a persona and empathy map; write a problem statement and HMW question.", "unit": 2}, {"title": "Triangulation and mixed methods", "page": 0, "body": "Compare interviews, observation and analytics to see whether different evidence supports the same finding. Mixed methods combine qualitative depth with quantitative measurement; conflicting evidence calls for investigation.", "source": "web", "unit": 2}, {"title": "Kinds of empathy and limits of signals", "page": 0, "body": "Cognitive empathy concerns understanding another perspective; emotional empathy concerns sharing or resonating with feelings; compassionate empathy adds helpful action. Behavioural signals can suggest emotions but do not prove a person’s internal state.", "source": "web", "unit": 2}, {"title": "Diary studies and observer effects", "page": 0, "body": "Diary studies collect participants’ experiences over time. The observer effect occurs when being observed changes behaviour; minimise intrusion and interpret the resulting evidence carefully.", "source": "web", "unit": 2}, {"title": "Interview structures and contextual inquiry", "page": 0, "body": "Structured interviews use a consistent predefined question set; semi-structured interviews combine a guide with follow-ups; unstructured interviews are more flexible. Critical-incident questions explore a notable specific event. Contextual inquiry studies people doing their work while explaining it.", "source": "web", "unit": 2}, {"title": "Synthesis through coding", "page": 0, "body": "Coding labels meaningful pieces of research data; thematic analysis identifies recurring patterns across them. Distinguish observed evidence from inferred interpretations.", "source": "web", "unit": 2}, {"title": "Measurement and prioritisation", "page": 0, "body": "Task completion rate is completed attempts divided by total attempts, multiplied by 100. Prioritise pain points using both frequency and severity; a frequent nuisance and a rare severe failure merit different consideration.", "source": "web", "unit": 2}, {"title": "Additional needs and pain categories", "page": 0, "body": "Latent needs may remain unrecognised until a new possibility makes them apparent. Functional pain concerns accomplishing the intended task; usability pain concerns difficulty using the solution; emotional pain concerns feelings such as anxiety or frustration.", "source": "web", "unit": 2}, {"title": "Responsible and evolving user models", "page": 0, "body": "Minimise collected personal data and provide opt-out. Segment users by behaviour as well as demographics. Primary personas guide main design priorities while secondary personas represent additional users. Update personas as evidence changes.", "source": "web", "unit": 2}, {"page": 5, "title": "Ideation and its purpose", "body": "Ideation generates and explores possible solutions after understanding users and defining the challenge. Seek many varied ideas before evaluating them. It supports innovation, collaboration, lower design risk and user satisfaction; a large count alone does not guarantee quality.", "unit": 3}, {"page": 6, "title": "Packaging evaluation example", "body": "The example scores cost, sustainability, feasibility and acceptance from 1 to 5, for a maximum of 20. Totals: paper 17, reusable containers 16, bamboo 15, plant-based plastics 13 and edible packaging 10. Paper wins this particular matrix, not every possible packaging decision.", "unit": 3}, {"page": 8, "title": "From an idea to a solution", "body": "The illustrated pipeline is Problem → Generate → Select → Prototype → Test → Implement. Build a simple version, gather real-user feedback and continue improving after launch. The running example addresses difficulty tracking study schedules and deadlines.", "unit": 3}, {"page": 9, "title": "Creative Problem Solving (CPS)", "body": "CPS combines creative and analytical work in four stages: Clarify, Ideate, Develop, Implement. Clarify asks what the actual problem is; Ideate explores alternatives; Develop compares and improves them; Implement makes the selected response work in practice.", "unit": 3}, {"page": 10, "title": "CPS: Clarify", "body": "Gather facts, study user expectations and investigate causes before choosing a solution. “Students lose track of assignments across courses” defines a difficulty; “students need an app” prematurely chooses a response. Repeated Why questions help find an actionable cause.", "unit": 3}, {"page": 11, "title": "CPS: Ideate", "body": "Generate freely, welcome unusual proposals and build on others without immediate criticism. For missed deadlines, explore calendars, voice reminders, shared planning, dashboards and other distinct approaches rather than refining one favourite too early.", "unit": 3}, {"page": 12, "title": "CPS: Develop", "body": "Compare advantages, disadvantages, practicality and user value; improve promising concepts and select one. In the PDF example, AI Study Assistant scores 21/25, while Reminder App and Printed Planner each score 20/25.", "unit": 3}, {"page": 13, "title": "CPS: Implement", "body": "Create a prototype, test with users, collect feedback, improve and launch. Implementation includes learning and revision; selection does not prove that a solution works.", "unit": 3}, {"page": 15, "title": "Divergent versus convergent thinking", "body": "Divergence expands possibilities: flexible, exploratory, original and nonjudgmental. Convergence narrows them: logical, analytical, evidence-based and decision-oriented. Use them as alternating phases. Early convergence suppresses possibilities; endless divergence prevents action.", "unit": 3}, {"page": 16, "title": "Separate generation from evaluation", "body": "Declare the current mode. During ideation, record ideas and use “Yes, and…” to extend contributions. Afterwards, restore evaluation and compare criteria. Deferring judgment is temporary, not a promise to implement every suggestion.", "unit": 3}, {"page": 18, "title": "Bridge comparison and trade-offs", "body": "The bridge example compares cost, safety, durability and environmental impact. Steel Arch B is selected for strong safety and durability despite not leading every criterion. Selection weighs trade-offs; it rarely produces an option superior on every measure.", "unit": 3}, {"page": 21, "title": "Constraint framing", "body": "Identify genuine limits and requirements: budget, time, technology, available people, regulation and environmental conditions. Constraints focus creativity and define scope. Distinguish real requirements from habits that can be challenged.", "unit": 3}, {"page": 22, "title": "Constraint categories and the bicycle example", "body": "Financial limits concern spending; time limits concern deadlines; technical limits concern available capabilities; legal limits concern rules; environmental limits concern sustainability. The bicycle brief specifies ₹25,000 budget, battery below 4 kg, maximum speed 25 km/h and environmentally considerate materials.", "unit": 3}, {"page": 23, "title": "Turn constraints into opportunities", "body": "Define the problem, identify constraints, convert constraints into opportunities, write HMW prompts, generate alternatives and evaluate. A tight budget can inspire lower-cost delivery, shared resources or a simpler service rather than merely blocking work.", "unit": 3}, {"page": 24, "title": "How Might We (HMW)", "body": "HMW reframes a problem as an open opportunity. Identify the action, user and desired goal while leaving room for several solutions. “How might we help students remember assignment deadlines?” is broader than prescribing a particular reminder app. Researching why a problem occurs remains useful before ideation.", "unit": 3}, {"page": 27, "title": "Brainstorming and Osborn’s rules", "body": "Brainstorming is structured group idea generation. Osborn’s four rules are suspend judgment, think freely, seek quantity, and combine/improve. The expanded seven add staying focused on the challenge, one conversation at a time and visual expression to deferring judgment, quantity, wild ideas and building on others.", "unit": 3}, {"page": 29, "title": "Brainstorming process", "body": "Identify the problem → define the objective → generate → record → group similar ideas → evaluate feasibility and impact → select. Record every contribution so that quieter voices and unusual options are not lost. Grouping prepares a manageable set for evaluation.", "unit": 3}, {"page": 30, "title": "Rapid brainstorming sprint", "body": "The PDF sprint uses 8 minutes and at least 30 ideas. A timekeeper does not join discussion. Record the total and how many ideas arrive in the final two minutes, when obvious answers may be exhausted. The separate Smart Campus exercise uses groups of five, ten ideas in five minutes, then theme categories.", "unit": 3}, {"page": 31, "title": "Idea generation workflow", "body": "Problem → Research → Generate → Combine and improve → Evaluate → Best solution. Techniques help teams explore beyond familiar answers; creativity remains linked to the actual user need.", "unit": 3}, {"page": 32, "title": "SCAMPER overview", "body": "Bob Eberle’s SCAMPER supplies seven prompts for transforming an existing product, service or process: Substitute, Combine, Adapt, Modify, Put to another use, Eliminate, Reverse/Rearrange. Prompts generate candidates; they do not establish feasibility or value.", "unit": 3}, {"page": 33, "title": "SCAMPER: Substitute", "body": "Replace a material, component, person, process or technology with an alternative. Examples include replacing plastic bags with cloth bags or paper forms with a suitable digital process. The defining move is replacement.", "unit": 3}, {"page": 34, "title": "SCAMPER: Combine", "body": "Merge functions, products, ideas or processes. A backpack integrated with a solar charger combines two functions. Make the combined value clear rather than adding unrelated features.", "unit": 3}, {"page": 35, "title": "SCAMPER: Adapt and biomimicry", "body": "Borrow a principle from another context and adjust it to the problem. Biomimicry borrows from nature: burr hooks inspired Velcro, kingfisher form informed a train nose, and lotus-leaf behaviour inspired self-cleaning surfaces. Analogy can also cross industries.", "unit": 3}, {"page": 36, "title": "SCAMPER: Modify, magnify and minify", "body": "Change size, shape, appearance, frequency, performance or features. Magnify enlarges or intensifies; minify reduces. Foldable screens, smaller projectors and increased service frequency illustrate modification.", "unit": 3}, {"page": 37, "title": "SCAMPER: Put to another use", "body": "Find a new application for an existing resource. A bottle becoming a planter or a parked bus becoming shaded seating retains the resource but changes its purpose. This helps overcome functional fixedness.", "unit": 3}, {"page": 38, "title": "SCAMPER: Eliminate", "body": "Remove unnecessary features, parts or steps. Simplifying an overloaded app may improve usability more than adding functions. Ask whether the whole assumed component is needed, not just whether it can be made smaller.", "unit": 3}, {"page": 39, "title": "SCAMPER: Reverse or rearrange", "body": "Change direction, sequence, roles or arrangement. Reversing who moves, when information is collected, or the order of service can expose assumptions. Use a clearly defined transformation because real designs can fit more than one SCAMPER category.", "unit": 3}, {"page": 40, "title": "Campus bus SCAMPER case", "body": "S: replace a fixed timetable with a demand signal. C: combine passenger and parcel trips. A: adapt airport departure displays. M: run smaller vehicles more often. P: use parked buses as seating/charging spaces. E: replace a short route with a covered walkway. R: timetable classes in one block instead of moving students. These are ideas to investigate, not proven solutions.", "unit": 3}, {"page": 41, "title": "Reading a SCAMPER result", "body": "Eliminate and Reverse can question whether the original solution should exist. The hardest prompt may expose an assumption the team is attached to. Generate first, then assess consequences, constraints and user value.", "unit": 3}, {"page": 42, "title": "Crazy 8s", "body": "Divide a sheet into eight panels and sketch eight distinct ideas in eight minutes. Each panel gets about one minute. The exercise uses no talking and no erasing; rough boxes, arrows and words are sufficient. Aim for different ideas, not eight refinements of one design.", "unit": 3}, {"page": 43, "title": "Mind mapping", "body": "Place a central topic in the middle; connect main categories and progressively finer sub-branches. Use keywords, short phrases, images or symbols to make relationships visible. A technical-fest map might branch into events, sponsors, budget, volunteers and marketing.", "unit": 3}, {"page": 45, "title": "Multi-branch mapping and gaps", "body": "Write the topic, add major branches, expand sub-branches, mark relationships, then review. Dense branches reveal developed thinking; sparse ones suggest areas to explore. The Smart Hospital case includes patient care, technology, support services, security and infrastructure.", "unit": 3}, {"page": 47, "title": "Reverse thinking and worst possible ideas", "body": "Ask how to worsen the situation, identify specific failure mechanisms, then turn each into a constructive design proposal. For a library, uneven sockets suggest distributing power access; seat hoarding suggests release rules; incompatible noise needs suggest separate zones. Reversal produces hypotheses that still need testing.", "unit": 3}, {"page": 49, "title": "Inversion thinking", "body": "Inversion focuses on avoiding failure. Define a goal, imagine failure, list causes, reverse those causes and implement better approaches. The notes associate this perspective with Charlie Munger. Avoiding customer neglect, poor quality and inappropriate pricing can guide a startup’s design decisions.", "unit": 3}, {"page": 50, "title": "Affinity clustering", "body": "Put one idea on each note, group related ideas silently, label the emerging themes, inspect relationships and then discuss. Clustering reveals patterns, reduces exact duplicates and supports shortlisting. Dense clusters show developed areas; sparse areas may contain unexplored opportunities.", "unit": 3}, {"page": 52, "title": "Zerodha case: challenge the question", "body": "The course case describes questioning percentage-based brokerage, focusing on first-time investors, replacing some sales work with software and using education to expand access. The lesson is to examine assumptions beneath an industry’s usual question. These are historical case-study points, not a statement of current pricing.", "unit": 3}, {"page": 54, "title": "Feasibility versus relevance", "body": "Feasibility asks whether an idea can be delivered; relevance asks whether it addresses the defined user problem. Technical feasibility concerns capability, economic feasibility affordability, operational feasibility acceptance/workflows, legal feasibility rules, and schedule feasibility time. Easy implementation alone does not make an idea worthwhile.", "unit": 3}, {"page": 55, "title": "Relevance–feasibility matrix", "body": "High relevance/high feasibility: prioritise. High relevance/low feasibility: consider and investigate adaptation. Low relevance/low feasibility: avoid. The PDF calls low relevance/high feasibility “quick wins”; do not confuse this with high-impact/low-effort quick wins in another matrix. Feasibility alone does not establish user value.", "unit": 3}, {"page": 56, "title": "Weighted scoring matrices", "body": "Agree criteria and weights before scoring all ideas consistently. Total = sum of weight × rating. The example weights user value 3, feasibility 2, novelty 1, speed 2 and cost 1. Define rating direction so higher always means better, such as affordability rather than raw expense. The reasoning behind weights matters more than apparent numerical precision.", "unit": 3}, {"page": 57, "title": "Worked matrix: corrected arithmetic", "body": "The page 57 table uses weights 20%, 25%, 20%, 20%, 15%. A ratings: 4,5,4,5,4 → 4.45/5. B: 3,4,5,4,3 → 3.85/5. C: 5,3,3,5,4 → 3.95/5. Using whole-number percent weights gives 445, 385 and 395. The printed totals 455, 405 and 420 do not match the displayed ratings. A still ranks first. Questions use the recalculated values.", "unit": 3}, {"page": 58, "title": "Selection and prioritisation", "body": "Selection chooses suitable ideas. Prioritisation determines importance, urgency and order. Compare business value, customer benefit, originality, cost, development time, risk and strategic alignment. The course example places AI Tutor high, Smart Parking medium and VR Campus Tour low; these are contextual rankings, not universal ones.", "unit": 3}, {"page": 59, "title": "Impact–effort matrix", "body": "High impact/low effort: top priority. High impact/high effort: strategic longer-term project. Low impact/low effort: optional if time permits. Low impact/high effort: avoid. The relevance–feasibility grid helps shortlist; impact–effort helps schedule the shortlist.", "unit": 3}, {"page": 60, "title": "100 ideas challenge and integrated pipeline", "body": "Generate about 15–20 ideas daily over a week using different techniques: free brainstorming, SCAMPER, analogy, reversal, mind mapping, What-if questions and building on earlier ideas. Compare quality as well as count. The capstone runs Clarify → Constrain → Reframe → Diverge → Cluster → Converge, using a 2×2 shortlist and weighted decision.", "unit": 3}, {"page": 0, "title": "Four dimensions of divergent output", "body": "Fluency means number of ideas; flexibility means breadth across categories; originality means uncommon relevant ideas; elaboration means developing useful detail. Many small variations can show fluency while offering little flexibility. Provocations and category changes can broaden exploration.", "source": "web", "unit": 3}, {"page": 0, "title": "Double diamond and brainwriting", "body": "The double-diamond pattern expands and narrows understanding of the problem, then expands and narrows possible solutions. Silent independent brainwriting before discussion reduces domination and production blocking. Round-robin or anonymous contributions can improve participation and psychological safety.", "source": "web", "unit": 3}, {"page": 0, "title": "Evaluation safeguards", "body": "Mandatory safety, legal and ethical requirements are gates, not weaknesses to cancel with unrelated high scores. Define rating scales, score independently, record assumptions and examine disagreement. Test alternative weights to assess ranking sensitivity; close totals should not create false confidence.", "source": "web", "unit": 3}, {"page": 0, "title": "Clustering outliers and planning a portfolio", "body": "Preserve unusual ideas and meaningful variations. One idea can connect multiple clusters; a grouping scheme should reveal user purpose rather than hide it behind technology categories. Prioritise enabling dependencies before dependent features, balance low-risk and exploratory work, assign owners and success measures, and update priorities as tests provide evidence.", "source": "web", "unit": 3}]}</script><script>
const DATA=JSON.parse(document.getElementById('course-data').textContent),Q=DATA.questions,C=DATA.concepts;
const names={1:'Learning, creativity & foundations',2:'Empathy, observation & problem identification',3:'Ideation & creative problem solving'},KEY='int335-practice-v1';
let state={answers:{},session:null},view='home',timer=null,locked=false,storageOK=true;
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&saved.answers&&typeof saved.answers==='object'){state=saved;if(state.session&&(!Array.isArray(state.session.ids)||state.session.ids.some(id=>!Q.some(q=>q.id===id))))state.session=null}}catch(e){storageOK=false}
const app=document.getElementById('app'),esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x])),byId=id=>Q.find(q=>q.id===id);
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){storageOK=false}}
function source(x){return x.source==='web'||!x.page?`Unit ${x.unit} · linked notes / MCQ topics`:`Unit ${x.unit} PDF · page ${esc(x.page)}`}
function go(v){clearTimeout(timer);locked=false;view=v;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));({home,concepts,practice,review})[v]();window.scrollTo(0,0)}
document.querySelector('nav').addEventListener('click',e=>{if(e.target.dataset.view)go(e.target.dataset.view)});
function home(){const n=Object.keys(state.answers).length,correct=Q.filter(q=>state.answers[q.id]===q.answer).length;app.innerHTML=`<section class="hero"><div><div class="eyebrow">Your units 01–03 study companion</div><h1>Understand the concepts.<br>Practice one at a time.</h1><p class="muted">A complete revision guide and ${Q.length} one-mark questions. Choose an option, get feedback, and the next question loads automatically.</p><div class="actions"><button class="primary" id="start-all">Start practising</button><button id="read-all">Explore concepts</button>${state.session?'<button id="resume">Resume session</button>':''}</div></div><div class="hero-note"><div class="eyebrow">Practice bank</div><strong>${Q.length} questions</strong><p>${C.length} concept summaries · 3 units<br>1 mark per correct answer · no negative marking</p><div>${n} attempted · ${correct} correct</div></div></section><section class="grid">${[1,2,3].map(u=>`<article class="card"><div class="eyebrow">UNIT 0${u}</div><h2>${names[u]}</h2><p class="muted">${C.filter(c=>c.unit===u).length} concepts · ${Q.filter(q=>q.unit===u).length} questions</p><div class="actions"><button data-study="${u}">Study unit</button><button data-unit="${u}" class="primary">Practise</button></div></article>`).join('')}</section><div class="footer">Original practice questions based on your three PDFs and the six supplied LPU Notes pages. These are revision questions, not an official exam bank. Historical examples describe the course case studies.<br>${storageOK?'Progress saves in this browser. Other devices and the offline copy have separate progress.':'Browser storage unavailable: progress lasts only while this page remains open.'}</div>`;document.getElementById('start-all').onclick=()=>go('practice');document.getElementById('read-all').onclick=()=>go('concepts');if(document.getElementById('resume'))document.getElementById('resume').onclick=()=>{go('practice');renderQuestion()};app.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{go('practice');document.getElementById('unit').value=b.dataset.unit;updateTopics()});app.querySelectorAll('[data-study]').forEach(b=>b.onclick=()=>{go('concepts');document.getElementById('c-unit').value=b.dataset.study;drawConcepts()})}
function unitOptions(){return '<option value="all">All three units</option>'+[1,2,3].map(u=>`<option value="${u}">Unit ${u}</option>`).join('')}
function concepts(){app.innerHTML=`<div class="eyebrow">The revision library</div><div class="section-top"><h1>All concepts</h1><button id="expand">Expand all</button></div><p class="muted">Definitions, methods, frameworks and case-study lessons, with source references.</p><div class="controls"><label>Unit<select id="c-unit">${unitOptions()}</select></label><label>Find a concept<input id="search" type="search" placeholder="Try SCAMPER, VARK or empathy"></label></div><p id="c-count" class="mini muted"></p><section id="concept-list"></section><div class="footer"><strong>Sources & framework note</strong><p>INT335 Unit 1, 2 and 3 PDFs (29, 47 and 63 pages), plus these supplied pages:</p>${[1,2,3].map(u=>`<a target="_blank" rel="noopener" href="https://notes.lpuverto.xyz/Sem1/INT335/Unit${u}/notes">Unit ${u} notes</a> · <a target="_blank" rel="noopener" href="https://notes.lpuverto.xyz/Sem1/INT335/Unit${u}/mcq">Unit ${u} MCQs</a>`).join('<br>')}<p>IDEO’s desirability/feasibility/viability are lenses. Hear/Create/Deliver and Inspiration/Ideation/Implementation are phase variants appearing in the linked materials. VARK describes preferences; matching instruction to a single preference is not established as improving learning.</p></div>`;document.getElementById('c-unit').onchange=drawConcepts;document.getElementById('search').oninput=drawConcepts;document.getElementById('expand').onclick=()=>{const ds=[...document.querySelectorAll('#concept-list details')],open=ds.some(d=>!d.open);ds.forEach(d=>d.open=open);document.getElementById('expand').textContent=open?'Collapse all':'Expand all'};drawConcepts()}
function drawConcepts(){const u=document.getElementById('c-unit').value,s=document.getElementById('search').value.trim().toLowerCase(),items=C.filter(c=>(u==='all'||c.unit==u)&&(c.title+' '+c.body).toLowerCase().includes(s));document.getElementById('c-count').textContent=`${items.length} concepts`;document.getElementById('concept-list').innerHTML=items.length?items.map(c=>`<details><summary>${esc(c.title)} <span class="pill">Unit ${c.unit}</span></summary><p>${esc(c.body)}</p><div class="concept-source">${source(c)}</div></details>`).join(''):'<p>No matching concepts. Try a broader search.</p>'}
function practice(){app.innerHTML=`<div class="quiz-wrap"><div class="eyebrow">Active recall, one question at a time</div><h1>Choose your practice.</h1><p class="muted">Every question is worth one mark. Feedback appears briefly after selection, then the next question loads. The previous explanation stays available below it.</p><div class="card"><div class="controls"><label>Unit<select id="unit">${unitOptions()}</select></label><label>Topic<select id="topic"></select></label><label>Question set<select id="mode"><option value="all">All questions</option><option value="unanswered">Not attempted yet</option><option value="wrong">My mistakes</option></select></label><label>Session length<select id="length"><option value="25">25 questions</option><option value="50">50 questions</option><option value="100">100 questions</option><option value="all">All matching questions</option></select></label><label>Order<select id="order"><option value="shuffle">Shuffled</option><option value="unit">Unit order</option></select></label><label>Auto-next delay<select id="delay"><option value="1200">1.2 seconds</option><option value="3000">3 seconds</option><option value="0">Immediately</option><option value="manual">Manual (read at your pace)</option></select></label></div><p id="pool-count" class="muted mini"></p><div class="actions"><button class="primary" id="begin">Start session</button>${state.session?'<button id="continue">Resume current session</button>':''}</div><p id="empty" role="status"></p></div></div>`;document.getElementById('unit').onchange=updateTopics;['topic','mode'].forEach(id=>document.getElementById(id).onchange=countPool);document.getElementById('begin').onclick=start;if(document.getElementById('continue'))document.getElementById('continue').onclick=renderQuestion;updateTopics()}
function updateTopics(){const u=document.getElementById('unit').value,ts=[...new Set(Q.filter(q=>u==='all'||q.unit==u).map(q=>q.topic))].sort();document.getElementById('topic').innerHTML='<option value="all">All topics</option>'+ts.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('');countPool()}
function pool(){const u=document.getElementById('unit').value,t=document.getElementById('topic').value,m=document.getElementById('mode').value;return Q.filter(q=>(u==='all'||q.unit==u)&&(t==='all'||q.topic===t)&&(m==='all'||(m==='unanswered'?state.answers[q.id]===undefined:state.answers[q.id]!==undefined&&state.answers[q.id]!==q.answer)))}
function countPool(){document.getElementById('pool-count').textContent=`${pool().length} matching questions available`}
function shuffled(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){let qs=pool();if(!qs.length){document.getElementById('empty').textContent='No matching questions. Change the filters.';return}if(document.getElementById('order').value==='shuffle')qs=shuffled(qs);let n=document.getElementById('length').value;state.session={ids:qs.slice(0,n==='all'?qs.length:+n).map(q=>q.id),index:0,responses:{},delay:document.getElementById('delay').value};save();renderQuestion()}
function renderQuestion(){clearTimeout(timer);locked=false;let s=state.session;if(!s){practice();return}if(s.index>=s.ids.length){results();return}const q=byId(s.ids[s.index]),answered=s.responses[q.id]!==undefined,prev=s.index?byId(s.ids[s.index-1]):null;app.innerHTML=`<section class="quiz-wrap"><div class="quiz-top"><div><div class="eyebrow">${esc(q.topic)}</div><span class="mini">Unit ${q.unit} · Question ${s.index+1} of ${s.ids.length} · 1 mark</span></div><button id="exit">Save & exit</button></div><div class="progress" aria-label="Session progress"><div style="width:${s.index/s.ids.length*100}%"></div></div><div class="card"><span class="pill">${esc(q.id)}</span><h2 class="question" id="question" tabindex="-1">${esc(q.q)}</h2><div class="options">${q.options.map((o,i)=>`<button class="option" data-answer="${i}"><span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div><div id="feedback" aria-live="polite"></div><div class="actions" style="margin-top:20px"><button id="skip">Skip for now</button><button id="next" class="primary hidden">Next question →</button></div><p class="mini muted">${s.delay==='manual'?'Manual advance enabled.':'Automatically advances after selection.'} Correct: 1 mark. Wrong or skipped: 0.</p></div>${prev&&s.responses[prev.id]!==undefined?`<details open style="margin-top:20px"><summary>Previous answer · ${s.responses[prev.id]===prev.answer?'Correct':'Incorrect'}</summary><p>${esc(prev.q)}<br><strong>Correct: ${esc(prev.options[prev.answer])}</strong><br>${esc(prev.explanation)}</p><div class="concept-source">${source(prev)}</div></details>`:''}</section>`;document.getElementById('exit').onclick=()=>go('home');document.getElementById('skip').onclick=()=>{s.index++;save();renderQuestion()};document.getElementById('next').onclick=advance;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(+b.dataset.answer));if(answered)showFeedback(q,s.responses[q.id]);document.getElementById('question').focus({preventScroll:true})}
function answer(a){if(locked)return;let s=state.session,q=byId(s.ids[s.index]);if(s.responses[q.id]!==undefined)return;locked=true;s.responses[q.id]=a;state.answers[q.id]=a;save();showFeedback(q,a);if(s.delay!=='manual')timer=setTimeout(advance,+s.delay)}
function showFeedback(q,a){locked=true;document.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;let i=+b.dataset.answer;if(i===q.answer)b.classList.add('correct');else if(i===a)b.classList.add('wrong')});document.getElementById('feedback').innerHTML=`<div class="feedback ${a===q.answer?'':'bad'}"><strong>${a===q.answer?'Correct · +1 mark':'Incorrect · 0 marks'}</strong><p>Answer: ${esc(q.options[q.answer])}<br>${esc(q.explanation)}</p><div class="mini">${source(q)}</div></div>`;document.getElementById('next').classList.remove('hidden');document.getElementById('skip').classList.add('hidden')}
function advance(){clearTimeout(timer);if(!state.session)return;state.session.index++;save();renderQuestion()}
function results(){const s=state.session,answered=Object.keys(s.responses).length,score=s.ids.filter(id=>s.responses[id]===byId(id).answer).length,wrong=s.ids.filter(id=>s.responses[id]!==undefined&&s.responses[id]!==byId(id).answer),skipped=s.ids.filter(id=>s.responses[id]===undefined);app.innerHTML=`<section class="quiz-wrap"><div class="eyebrow">Session complete</div><h1>${score} / ${s.ids.length} marks</h1><p class="muted">${Math.round(score/s.ids.length*100)}% score. Review the explanations, then try again.</p><div class="stats"><div><strong>${score}</strong>Correct</div><div><strong>${answered-score}</strong>Incorrect</div><div><strong>${skipped.length}</strong>Skipped</div></div><div class="actions"><button class="primary" id="again">New session</button><button id="mistakes" ${wrong.length?'':'disabled'}>Retry mistakes (${wrong.length})</button><button id="skipped" ${skipped.length?'':'disabled'}>Try skipped (${skipped.length})</button><button id="session-review">Review this session</button></div><div id="session-list"></div></section>`;document.getElementById('again').onclick=()=>go('practice');function retry(ids){state.session={ids:shuffled(ids),index:0,responses:{},delay:s.delay};save();renderQuestion()}document.getElementById('mistakes').onclick=()=>retry(wrong);document.getElementById('skipped').onclick=()=>retry(skipped);document.getElementById('session-review').onclick=()=>{document.getElementById('session-list').innerHTML=s.ids.map(id=>reviewCard(byId(id),s.responses[id])).join('')}}
function reviewCard(q,a){return `<article class="review-item ${a===q.answer?'':'bad'}"><span class="mini muted">${esc(q.id)} · ${esc(q.topic)} · ${a===undefined?'Skipped':a===q.answer?'Correct':'Incorrect'}</span><h3>${esc(q.q)}</h3><p>Your answer: ${a===undefined?'Not answered':esc(q.options[a])}<br><strong>Correct answer: ${esc(q.options[q.answer])}</strong></p><p>${esc(q.explanation)}</p><div class="concept-source">${source(q)}</div></article>`}
function review(){app.innerHTML=`<div class="eyebrow">Learn from every answer</div><h1>Your answer review</h1><p class="muted">Your latest attempt at each question. Session results retain that session’s score.</p><div class="controls"><label>Unit<select id="r-unit">${unitOptions()}</select></label><label>Show<select id="r-mode"><option value="all">All attempted</option><option value="wrong">Mistakes only</option><option value="correct">Correct only</option></select></label></div><p id="r-count"></p><section id="review-list"></section>`;function draw(){const u=document.getElementById('r-unit').value,m=document.getElementById('r-mode').value,qs=Q.filter(q=>state.answers[q.id]!==undefined&&(u==='all'||q.unit==u)&&(m==='all'||(m==='wrong'?state.answers[q.id]!==q.answer:state.answers[q.id]===q.answer)));document.getElementById('r-count').textContent=`${qs.length} questions`;document.getElementById('review-list').innerHTML=qs.length?qs.map(q=>reviewCard(q,state.answers[q.id])).join(''):'<div class="card">No answers here yet. Start practising or change filters.</div>'}document.getElementById('r-unit').onchange=draw;document.getElementById('r-mode').onchange=draw;draw()}
home();
</script></body></html>
