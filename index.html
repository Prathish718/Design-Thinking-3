<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INT335 Study & Practice</title><style>
:root{--ink:#193d37;--muted:#526d66;--paper:#f5f6ef;--line:#d9e2d8;--green:#205d49;--soft:#e5efdb}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:11px 18px;background:white;color:var(--ink)}button:hover{border-color:var(--green);background:#f0f5e9}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b07926;outline-offset:3px}button.primary{background:var(--green);color:white}button:disabled{cursor:default;opacity:.7}header{border-bottom:1px solid var(--line);background:white;padding:20px max(24px,calc((100vw - 1160px)/2));display:flex;gap:20px;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:21px}.brand span{font-weight:400;color:var(--muted)}nav{display:flex;gap:7px;flex-wrap:wrap}nav button{border:0;background:transparent}nav button.active{background:var(--soft)}main{max-width:1160px;margin:auto;padding:40px 24px 70px}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:750;color:var(--muted)}h1{font-size:clamp(32px,5vw,54px);letter-spacing:-2px;line-height:1.12;margin:12px 0 18px}h2{line-height:1.3;font-size:26px}h3{line-height:1.4}p{margin:8px 0 16px}.muted{color:var(--muted)}.hero{display:grid;grid-template-columns:1.7fr 1fr;gap:40px;align-items:center;margin-bottom:32px}.hero-note{background:var(--soft);border-radius:22px;padding:28px}.hero-note strong{font-size:44px;line-height:1.2;display:block}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:25px}.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.controls{display:flex;gap:16px;flex-wrap:wrap;margin:24px 0;align-items:end}label{display:block;font-size:14px;color:var(--muted)}select,input[type=search]{display:block;max-width:100%;border:1px solid var(--line);background:white;color:var(--ink);border-radius:8px;padding:10px;margin-top:5px}input[type=search]{width:340px}.quiz-wrap{max-width:840px;margin:auto}.quiz-top{display:flex;justify-content:space-between;gap:15px}.progress{height:7px;background:var(--line);border-radius:9px;overflow:hidden;margin:18px 0 28px}.progress div{height:100%;background:var(--green)}.question{font-size:25px;line-height:1.5;margin:20px 0}.options{display:grid;gap:12px}.option{text-align:left;display:flex;align-items:center;gap:16px;padding:17px}.letter{width:32px;height:32px;flex-shrink:0;display:grid;place-items:center;border-radius:8px;background:var(--paper);font-weight:700}.option.correct{background:#e5f3e1;border-color:#53864b}.option.wrong{background:#fbe9e5;border-color:#bc6b5f}.feedback{padding:15px 18px;margin-top:20px;border-radius:12px;background:var(--soft)}.feedback.bad{background:#fae9e4}.mini{font-size:13px}.pill{display:inline-block;padding:4px 10px;border-radius:6px;background:var(--soft);font-size:12px;font-weight:650}.section-top{display:flex;justify-content:space-between;gap:20px;align-items:center}details{background:white;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;padding:16px 20px}summary{font-weight:650;cursor:pointer}details p{white-space:pre-line;margin-top:15px}.concept-source{font-size:12px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.stats div{padding:18px;background:var(--soft);border-radius:12px}.stats strong{display:block;font-size:28px}a{color:var(--green)}.footer{margin-top:36px;border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font-size:13px}.hidden{display:none!important}.review-item{margin:16px 0;border-left:4px solid var(--green);padding:15px 20px;background:white}.review-item.bad{border-color:#9c3535}@media(max-width:700px){header{padding:16px;display:block}nav{margin-top:14px}main{padding:25px 16px}.hero,.grid{grid-template-columns:1fr;gap:16px}.hero-note{padding:18px}.hero-note strong{font-size:32px}.question{font-size:21px}.card{padding:19px}.section-top{align-items:start;flex-direction:column}.controls>*{flex:1 1 180px}h1{letter-spacing:-1px}}
</style></head><body><header><div class="brand">INT335 <span>/ Design Thinking</span></div><nav aria-label="Main"><button data-view="home" class="active">Overview</button><button data-view="concepts">All concepts</button><button data-view="practice">Practice</button><button data-view="review">Review answers</button></nav></header><main id="app"></main><script id="course-data" type="application/json">{"questions": [{"q": "Which mode uses concentrated attention on a specific task?", "options": ["Focused mode", "Diffuse mode", "Conformity", "Functional fixedness"], "answer": 0, "explanation": "Focused mode uses concentrated attention and established pathways.", "page": 5, "topic": "Thinking modes", "source": "pdf", "unit": 1, "id": "U1-001"}, {"q": "A student follows an equation-solving procedure step by step. Which mode predominates?", "options": ["Diffuse", "Focused", "Kinesthetic preference", "Disruptive"], "answer": 1, "explanation": "Sequential analytical work illustrates focused thinking.", "page": 5, "topic": "Thinking modes", "source": "pdf", "unit": 1, "id": "U1-002"}, {"q": "Which description best fits diffuse thinking?", "options": ["Strict execution of a known procedure", "Attention limited to one calculation", "Relaxed thought that makes broader connections", "Memorising without linking ideas"], "answer": 2, "explanation": "Diffuse mode supports broad associative connections.", "page": 5, "topic": "Thinking modes", "source": "pdf", "unit": 1, "id": "U1-003"}, {"q": "Which activity most directly illustrates focused thinking in the notes?", "options": ["Letting connections emerge during a walk", "Relaxed association between unrelated ideas", "Daydreaming after studying", "Analysing data"], "answer": 3, "explanation": "The notes list data analysis under focused mode.", "page": 5, "topic": "Thinking modes", "source": "pdf", "unit": 1, "id": "U1-004"}, {"q": "Which quality is associated with diffuse mode?", "options": ["Exploratory flexibility", "Strict sequential processing", "Rigid use of one pathway", "Exclusive concentration on a procedure"], "answer": 0, "explanation": "Diffuse thinking is exploratory and flexible.", "page": 5, "topic": "Thinking modes", "source": "pdf", "unit": 1, "id": "U1-005"}, {"q": "Which pair correctly matches mode and characteristic?", "options": ["Focused—associative; diffuse—sequential", "Focused—analytical; diffuse—associative", "Focused—relaxed; diffuse—procedural", "Focused—unstructured; diffuse—concentrated"], "answer": 1, "explanation": "The two modes differ in concentration and breadth of association.", "page": 5, "topic": "Thinking modes", "source": "pdf", "unit": 1, "id": "U1-006"}, {"q": "After sustained work on a difficult problem, what does the unit recommend when stuck?", "options": ["Avoid ever returning to the task", "Repeat the same step without interruption", "Take a break to allow diffuse processing", "Wait for insight without learning the material"], "answer": 2, "explanation": "A break lets diffuse processing reorganise prior focused effort.", "page": 6, "topic": "Alternating modes", "source": "pdf", "unit": 1, "id": "U1-007"}, {"q": "Why is prior focused effort important for diffuse insight?", "options": ["It guarantees every idea is correct", "It eliminates the need for testing", "It prevents broad connections", "It supplies material for the mind to reorganise"], "answer": 3, "explanation": "Diffuse processing works on material already encountered.", "page": 6, "topic": "Alternating modes", "source": "pdf", "unit": 1, "id": "U1-008"}, {"q": "Which study cycle best follows the unit's advice?", "options": ["Work intently, take a walk, then return", "Walk continuously without studying", "Concentrate indefinitely without breaks", "Only copy notes without thinking"], "answer": 0, "explanation": "Alternating concentration and relaxation supports problem solving.", "page": 6, "topic": "Alternating modes", "source": "pdf", "unit": 1, "id": "U1-009"}, {"q": "What is the purpose of the Mendeleev dream anecdote in the unit?", "options": ["Prove dreams replace scientific work", "Illustrate insight after prolonged focused effort", "Show all inventions occur during sleep", "Reject deliberate study"], "answer": 1, "explanation": "The anecdote follows days of focused work and illustrates later insight.", "page": 6, "topic": "Alternating modes", "source": "pdf", "unit": 1, "id": "U1-010"}, {"q": "Activity 1.1 asks learners to track what?", "options": ["Only their examination scores", "Only the number of books bought", "Where and when their best ideas arise", "Their preferred smartphone brand"], "answer": 2, "explanation": "Tracking activity, time and mental state builds awareness of thinking patterns.", "page": 6, "topic": "Alternating modes", "source": "pdf", "unit": 1, "id": "U1-011"}, {"q": "Which claim conflicts with the unit's practical rule?", "options": ["Breaks can support broader connections", "Focused work can precede relaxed insight", "Both thinking modes can contribute", "Diffuse mode produces insight from an empty mind"], "answer": 3, "explanation": "The notes explicitly state that diffuse mode does not work on an empty mind.", "page": 6, "topic": "Alternating modes", "source": "pdf", "unit": 1, "id": "U1-012"}, {"q": "What does V in VARK represent?", "options": ["Visual", "Verbal reasoning", "Viability", "Verification"], "answer": 0, "explanation": "Visual preferences involve diagrams, charts and images.", "page": 7, "topic": "VARK preferences", "source": "pdf", "unit": 1, "id": "U1-013"}, {"q": "Which VARK preference emphasises listening and discussion?", "options": ["Visual", "Auditory", "Reading/Writing", "Kinesthetic"], "answer": 1, "explanation": "Auditory preference concerns listening and discussion.", "page": 7, "topic": "VARK preferences", "source": "pdf", "unit": 1, "id": "U1-014"}, {"q": "Which learner preference is best illustrated by using books and written notes?", "options": ["Kinesthetic", "Auditory", "Reading/Writing", "Visual only"], "answer": 2, "explanation": "Written materials are associated with Reading/Writing.", "page": 7, "topic": "VARK preferences", "source": "pdf", "unit": 1, "id": "U1-015"}, {"q": "Which VARK category is associated with practical hands-on experience?", "options": ["Auditory", "Reading/Writing", "Visual", "Kinesthetic"], "answer": 3, "explanation": "Kinesthetic describes a preference for practical experience.", "page": 7, "topic": "VARK preferences", "source": "pdf", "unit": 1, "id": "U1-016"}, {"q": "In the stated VARK activity, which statements are added for V?", "options": ["1 and 5", "2 and 6", "3 and 7", "4 and 8"], "answer": 0, "explanation": "The notes give V=1+5.", "page": 7, "topic": "VARK preferences", "source": "pdf", "unit": 1, "id": "U1-017"}, {"q": "In the stated VARK activity, which pairing calculates K?", "options": ["1 and 5", "4 and 8", "2 and 6", "3 and 7"], "answer": 1, "explanation": "The notes give K=4+8.", "page": 7, "topic": "VARK preferences", "source": "pdf", "unit": 1, "id": "U1-018"}, {"q": "A learner prefers discussing a topic aloud. Which VARK preference does this suggest?", "options": ["Kinesthetic", "Visual", "Auditory", "Reading/Writing"], "answer": 2, "explanation": "Discussion is associated with the auditory preference.", "page": 7, "topic": "VARK preferences", "source": "pdf", "unit": 1, "id": "U1-019"}, {"q": "How should a VARK result be treated according to the evidence note?", "options": ["A permanent limit on how one can learn", "Proof that matched teaching raises scores", "A replacement for study practice", "A prompt for self-awareness"], "answer": 3, "explanation": "The notes recommend reflection rather than rigid learning-style rules.", "page": 8, "topic": "Evidence about learning", "source": "pdf", "unit": 1, "id": "U1-020"}, {"q": "Which stronger VARK claim has failed to hold up in controlled studies?", "options": ["Matching teaching to preferred style improves results", "People report study preferences", "Diagrams can present information", "Discussion is a study activity"], "answer": 0, "explanation": "The warning targets the teaching-to-preference improvement claim.", "page": 8, "topic": "Evidence about learning", "source": "pdf", "unit": 1, "id": "U1-021"}, {"q": "Which set contains the three supported study strategies named in the unit?", "options": ["Style matching, cramming, passive copying", "Retrieval practice, spacing, interleaving", "Only listening, only reading, only watching", "Conformity, fixedness, premature judgment"], "answer": 1, "explanation": "These three strategies are explicitly listed as replicating.", "page": 8, "topic": "Evidence about learning", "source": "pdf", "unit": 1, "id": "U1-022"}, {"q": "What broader lesson follows from VARK's popularity?", "options": ["Popular ideas are always experimentally proven", "Preferences are identical to learning outcomes", "Popularity does not establish research support", "Research is unnecessary for familiar ideas"], "answer": 2, "explanation": "An idea can become popular without evidence for its stronger claims.", "page": 8, "topic": "Evidence about learning", "source": "pdf", "unit": 1, "id": "U1-023"}, {"q": "A student says, 'I am visual, so I cannot learn from discussion.' Which response fits the unit?", "options": ["Avoid all discussion permanently", "Request only images in every subject", "Assume the score proves inability", "Treat the preference as a nudge, not a rule"], "answer": 3, "explanation": "The unit rejects treating preferences as restrictive rules.", "page": 8, "topic": "Evidence about learning", "source": "pdf", "unit": 1, "id": "U1-024"}, {"q": "Which principle links the evidence note to human-centred design?", "options": ["What people say they want may differ from what works", "Every stated preference must dictate a solution", "Popular solutions need no testing", "User statements always prove effectiveness"], "answer": 0, "explanation": "Preferences and effective outcomes should not be assumed identical.", "page": 8, "topic": "Evidence about learning", "source": "pdf", "unit": 1, "id": "U1-025"}, {"q": "What is functional fixedness?", "options": ["Generating multiple possible functions", "Seeing objects only in conventional roles", "Evaluating ideas with users", "Alternating thinking modes"], "answer": 1, "explanation": "Fixedness restricts an object to its traditional purpose.", "page": 9, "topic": "Functional fixedness", "source": "pdf", "unit": 1, "id": "U1-026"}, {"q": "Using a paper clip as a zipper pull demonstrates what?", "options": ["Conformity to its document-holding role", "Premature rejection", "Overcoming functional fixedness", "Economic viability"], "answer": 2, "explanation": "A zipper pull is an unconventional function for a paper clip.", "page": 9, "topic": "Functional fixedness", "source": "pdf", "unit": 1, "id": "U1-027"}, {"q": "In the candle problem, what overlooked function can the matchbox serve?", "options": ["A source of electric current", "A replacement for candle wax", "A device that removes the need for fire", "A candle holder attached to the wall"], "answer": 3, "explanation": "The key is treating the box as a holder rather than only storage.", "page": 9, "topic": "Functional fixedness", "source": "pdf", "unit": 1, "id": "U1-028"}, {"q": "Why might someone overlook the matchbox solution?", "options": ["They treat the box only as storage for matches", "They have tested too many prototypes", "They consider all material properties", "They have already reframed the object"], "answer": 0, "explanation": "Its familiar storage role can obscure an alternative supporting role.", "page": 9, "topic": "Functional fixedness", "source": "pdf", "unit": 1, "id": "U1-029"}, {"q": "Which classroom exercise directly challenges functional fixedness?", "options": ["Repeat its usual use three times", "Suggest three non-obvious uses for an object", "Reject uses before considering them", "Rank objects only by brand"], "answer": 1, "explanation": "Unconventional uses challenge fixed assumptions.", "page": 9, "topic": "Functional fixedness", "source": "pdf", "unit": 1, "id": "U1-030"}, {"q": "Which example preserves functional fixedness?", "options": ["Using a paper clip as a bookmark", "Using a paper clip to organise cables", "Insisting a paper clip can only hold documents", "Using a paper clip as a reset tool"], "answer": 2, "explanation": "Restricting it to its standard role is the defining limitation.", "page": 9, "topic": "Functional fixedness", "source": "pdf", "unit": 1, "id": "U1-031"}, {"q": "What is the first move in the bucket technique?", "options": ["Choose the final product immediately", "Reject unusual functions", "Copy only its marketed purpose", "List properties instead of customary uses"], "answer": 3, "explanation": "Properties create new routes to functions.", "page": 10, "topic": "Property technique", "source": "pdf", "unit": 1, "id": "U1-032"}, {"q": "Which bucket property suggests a megaphone?", "options": ["It amplifies sound", "It is watertight", "It has a handle", "It can contain soil"], "answer": 0, "explanation": "The acoustic property opens the megaphone use.", "page": 10, "topic": "Property technique", "source": "pdf", "unit": 1, "id": "U1-033"}, {"q": "Which property most directly suggests an emergency water store?", "options": ["Sound amplification", "Watertightness", "Stackability", "Colour"], "answer": 1, "explanation": "Watertightness allows liquid to be retained.", "page": 10, "topic": "Property technique", "source": "pdf", "unit": 1, "id": "U1-034"}, {"q": "Which property most directly suggests a hanging planter?", "options": ["Being opaque", "Amplifying sound", "Having a handle", "Having printed branding"], "answer": 2, "explanation": "The handle supports hanging uses.", "page": 10, "topic": "Property technique", "source": "pdf", "unit": 1, "id": "U1-035"}, {"q": "Which property supports using a bucket as a stool in the example?", "options": ["Sound amplification", "Transparency", "Electrical conductivity", "Rigidity and strength"], "answer": 3, "explanation": "The notes connect rigidity and strength to supporting weight.", "page": 10, "topic": "Property technique", "source": "pdf", "unit": 1, "id": "U1-036"}, {"q": "Which bucket property leads to a market display riser in the notes?", "options": ["Being light and stackable", "Being watertight", "Having a handle", "Amplifying sound"], "answer": 0, "explanation": "Light, stackable form suggests risers and spacers.", "page": 10, "topic": "Property technique", "source": "pdf", "unit": 1, "id": "U1-037"}, {"q": "Why does naming properties help generate new uses?", "options": ["It proves every proposed use is safe", "It shifts attention away from familiar object roles", "It removes the need for user research", "It guarantees commercial success"], "answer": 1, "explanation": "Properties reveal possibilities hidden by the familiar label.", "page": 10, "topic": "Property technique", "source": "pdf", "unit": 1, "id": "U1-038"}, {"q": "A student hides an idea because classmates may laugh. Which block is present?", "options": ["Diffuse thinking", "Analogous inspiration", "Fear of failure", "Viability analysis"], "answer": 2, "explanation": "Fear of criticism can prevent proposing ideas.", "page": 11, "topic": "Cognitive blocks", "source": "pdf", "unit": 1, "id": "U1-039"}, {"q": "A team dismisses an unusual suggestion before exploring it. Which block is this?", "options": ["Empathy", "Prototyping", "Task-shifting", "Premature judgment"], "answer": 3, "explanation": "Rejecting before exploration is premature judgment.", "page": 11, "topic": "Cognitive blocks", "source": "pdf", "unit": 1, "id": "U1-040"}, {"q": "A learner copies the majority's approach mainly to fit in. Which block is this?", "options": ["Conformity", "Creative confidence", "Diffuse processing", "Problem reframing"], "answer": 0, "explanation": "Conformity follows conventional thinking for acceptance.", "page": 11, "topic": "Cognitive blocks", "source": "pdf", "unit": 1, "id": "U1-041"}, {"q": "An engineer insists on an old solution because it worked previously. Which block is evident?", "options": ["Kinesthetic preference", "The expertise trap", "Desirability", "Iteration"], "answer": 1, "explanation": "Over-reliance on past solutions characterises the expertise trap.", "page": 11, "topic": "Cognitive blocks", "source": "pdf", "unit": 1, "id": "U1-042"}, {"q": "Which set helps overcome cognitive blocks in the unit?", "options": ["Conformity, early rejection and secrecy", "Rigid routines and fear of criticism", "Empathy, experimentation and collaboration", "Technical selection without user contact"], "answer": 2, "explanation": "DT uses empathy, experimentation and collaboration.", "page": 11, "topic": "Cognitive blocks", "source": "pdf", "unit": 1, "id": "U1-043"}, {"q": "Which action best counters premature judgment?", "options": ["Dismiss it when it sounds unfamiliar", "Only consider the first suggestion", "Treat initial impressions as final evidence", "Explore an idea before rejecting it"], "answer": 3, "explanation": "Exploration delays unsupported rejection.", "page": 11, "topic": "Cognitive blocks", "source": "pdf", "unit": 1, "id": "U1-044"}, {"q": "Why can expertise sometimes become a creative obstacle?", "options": ["Past success can narrow the search for alternatives", "Experience makes empathy impossible", "Knowledge eliminates all uncertainty", "Experts cannot build prototypes"], "answer": 0, "explanation": "The trap is dependence on familiar successful approaches.", "page": 11, "topic": "Cognitive blocks", "source": "pdf", "unit": 1, "id": "U1-045"}, {"q": "Which behaviour demonstrates creative confidence rather than fear of failure?", "options": ["Remaining silent to avoid criticism", "Sharing a tentative idea for exploration", "Waiting for guaranteed success before speaking", "Only repeating accepted ideas"], "answer": 1, "explanation": "Offering tentative ideas counters fear-based hesitation.", "page": 11, "topic": "Cognitive blocks", "source": "pdf", "unit": 1, "id": "U1-046"}, {"q": "Which definition best describes creativity?", "options": ["Only manufacturing a finished device", "Following a procedure unchanged", "Generating original and useful ideas", "Copying any existing design"], "answer": 2, "explanation": "Creativity concerns original and useful ideas.", "page": 12, "topic": "Creativity invention innovation", "source": "pdf", "unit": 1, "id": "U1-047"}, {"q": "Which definition best describes invention?", "options": ["Only earning profit from an existing idea", "Rejecting unfamiliar concepts", "Identifying a preferred study style", "Creating something new that did not exist before"], "answer": 3, "explanation": "Invention means creating a new thing.", "page": 12, "topic": "Creativity invention innovation", "source": "pdf", "unit": 1, "id": "U1-048"}, {"q": "Which definition best describes innovation?", "options": ["Implementing creative ideas successfully to create value", "Having an idea without implementation", "Producing novelty with no useful outcome", "Keeping an idea private forever"], "answer": 0, "explanation": "Innovation requires implementation and value.", "page": 12, "topic": "Creativity invention innovation", "source": "pdf", "unit": 1, "id": "U1-049"}, {"q": "Imagining a drone delivery system is used as an example of what?", "options": ["Conformity", "Creativity", "Waterfall", "Cross-subsidy"], "answer": 1, "explanation": "The course uses the imagined system to illustrate idea generation.", "page": 12, "topic": "Creativity invention innovation", "source": "pdf", "unit": 1, "id": "U1-050"}, {"q": "The first telephone is presented as an example of what?", "options": ["Premature judgment", "Diffuse mode", "Invention", "Viability testing"], "answer": 2, "explanation": "The notes place the first telephone under invention.", "page": 12, "topic": "Creativity invention innovation", "source": "pdf", "unit": 1, "id": "U1-051"}, {"q": "In the course comparison, the iPhone illustrates what?", "options": ["Functional fixedness", "Fear of failure", "A wicked problem", "Innovation"], "answer": 3, "explanation": "It illustrates implemented ideas creating value.", "page": 12, "topic": "Creativity invention innovation", "source": "pdf", "unit": 1, "id": "U1-052"}, {"q": "When does creativity become innovation according to the unit?", "options": ["When it delivers value through implementation", "As soon as an idea sounds original", "Only when a patent is filed", "Whenever an idea is discussed"], "answer": 0, "explanation": "Value delivery is required, not just originality.", "page": 12, "topic": "Creativity invention innovation", "source": "pdf", "unit": 1, "id": "U1-053"}, {"q": "A team has an original useful concept but has not implemented it. What is established so far?", "options": ["Successful innovation", "Creativity", "Economic sustainability", "Market disruption"], "answer": 1, "explanation": "An idea shows creativity; implementation and value remain unproven.", "page": 12, "topic": "Creativity invention innovation", "source": "pdf", "unit": 1, "id": "U1-054"}, {"q": "Which mapping matches the unit's summary?", "options": ["Creativity—value; invention—preference; innovation—dream", "Creativity—manufacture; invention—feedback; innovation—judgment", "Creativity—idea; invention—new thing; innovation—value", "Creativity—conformity; invention—habit; innovation—analysis"], "answer": 2, "explanation": "The summary is idea, new thing and value.", "page": 12, "topic": "Creativity invention innovation", "source": "pdf", "unit": 1, "id": "U1-055"}, {"q": "How does the unit describe incremental invention?", "options": ["Only creating entirely new markets", "Rejecting all existing products", "Any change without a useful effect", "Small meaningful improvements to existing products or processes"], "answer": 3, "explanation": "Incremental change improves something existing.", "page": 13, "topic": "Incremental and disruptive change", "source": "pdf", "unit": 1, "id": "U1-056"}, {"q": "Which transition is listed as incremental in the course notes?", "options": ["USB to USB Type-C", "A study break to a walk", "Empathize to Define", "A matchbox to conventional storage"], "answer": 0, "explanation": "USB Type-C is a stated incremental example.", "page": 13, "topic": "Incremental and disruptive change", "source": "pdf", "unit": 1, "id": "U1-057"}, {"q": "Which characteristic is associated with disruptive innovation in the notes?", "options": ["Only cosmetic changes with no value", "Simpler, cheaper or more accessible solutions", "Avoiding unmet needs", "Preserving every incumbent's position"], "answer": 1, "explanation": "The course emphasises accessibility, simplicity and cost.", "page": 13, "topic": "Incremental and disruptive change", "source": "pdf", "unit": 1, "id": "U1-058"}, {"q": "Disruptive innovation in the unit focuses on what?", "options": ["Only internal organisational habits", "Avoiding new markets", "Unmet customer needs", "Guaranteeing expensive products"], "answer": 2, "explanation": "The notes connect disruption with unmet customer needs.", "page": 13, "topic": "Incremental and disruptive change", "source": "pdf", "unit": 1, "id": "U1-059"}, {"q": "Which pairing reproduces a course example of disruption?", "options": ["Netflix—cataract surgery", "Airbnb—USB connectors", "Uber—written textbooks", "Netflix—DVD rental stores"], "answer": 3, "explanation": "The table pairs Netflix with DVD rental stores.", "page": 13, "topic": "Incremental and disruptive change", "source": "pdf", "unit": 1, "id": "U1-060"}, {"q": "Which industry is paired with Airbnb in the disruption table?", "options": ["The hotel industry", "Eye-care surgery", "Consumer electronics manufacturing", "Printed textbooks"], "answer": 0, "explanation": "Airbnb is paired with hotels in the course table.", "page": 13, "topic": "Incremental and disruptive change", "source": "pdf", "unit": 1, "id": "U1-061"}, {"q": "Which transition is listed as incremental in the notes?", "options": ["Traditional taxis to Uber", "Petrol cars to hybrid cars", "DVD rentals to Netflix", "Hotels to Airbnb"], "answer": 1, "explanation": "The course classifies the hybrid transition as incremental.", "page": 13, "topic": "Incremental and disruptive change", "source": "pdf", "unit": 1, "id": "U1-062"}, {"q": "Which problem type has clear goals, constraints and one correct answer?", "options": ["Ill-defined", "Wicked", "Well-defined", "Unframed by definition"], "answer": 2, "explanation": "Well-defined problems have explicit goals and a correct answer.", "page": 14, "topic": "Problem types", "source": "pdf", "unit": 1, "id": "U1-063"}, {"q": "Which type has unclear goals or paths and multiple possible solutions?", "options": ["Well-defined", "Purely numerical", "Already solved", "Ill-defined"], "answer": 3, "explanation": "Ill-defined problems allow multiple approaches.", "page": 14, "topic": "Problem types", "source": "pdf", "unit": 1, "id": "U1-064"}, {"q": "How are solutions to wicked problems evaluated in the notes?", "options": ["As better or worse", "Only as mathematically right or wrong", "Only by whether code compiles", "Only by calculation speed"], "answer": 0, "explanation": "Wicked problems do not have simple right-or-wrong solutions.", "page": 14, "topic": "Problem types", "source": "pdf", "unit": 1, "id": "U1-065"}, {"q": "Which example is listed as well-defined?", "options": ["A marketing strategy", "An equation", "Poverty", "Healthcare as a complex system"], "answer": 1, "explanation": "Equations are a well-defined example.", "page": 14, "topic": "Problem types", "source": "pdf", "unit": 1, "id": "U1-066"}, {"q": "Which example is listed as ill-defined?", "options": ["A fixed arithmetic equation", "A puzzle with one answer", "App design", "A specified technical fix"], "answer": 2, "explanation": "App design can have unclear goals and multiple solutions.", "page": 14, "topic": "Problem types", "source": "pdf", "unit": 1, "id": "U1-067"}, {"q": "Which example is listed as wicked?", "options": ["A basic equation", "A puzzle with a single answer", "A fully specified calculation", "Climate problems"], "answer": 3, "explanation": "Climate is among the interconnected wicked problems.", "page": 14, "topic": "Problem types", "source": "pdf", "unit": 1, "id": "U1-068"}, {"q": "Why does the unit distinguish problem types?", "options": ["Different kinds of problems need different approaches", "Every problem has one correct answer", "Design Thinking only solves equations", "Technical methods never have any use"], "answer": 0, "explanation": "Well-defined methods do not automatically resolve the other types.", "page": 14, "topic": "Problem types", "source": "pdf", "unit": 1, "id": "U1-069"}, {"q": "A problem combines interdependent social issues without a definitive right answer. What type is it?", "options": ["Well-defined", "Wicked", "A procedural calculation", "A closed puzzle"], "answer": 1, "explanation": "Interconnection and better-or-worse outcomes indicate wickedness.", "page": 14, "topic": "Problem types", "source": "pdf", "unit": 1, "id": "U1-070"}, {"q": "What is central to Design Thinking's definition?", "options": ["Selecting technology before identifying needs", "Avoiding revision after planning", "Understanding users' needs and experiences", "Maximising features regardless of use"], "answer": 2, "explanation": "Design Thinking is human-centred.", "page": 15, "topic": "Design Thinking principles", "source": "pdf", "unit": 1, "id": "U1-071"}, {"q": "Whose perspective best informs understanding a problem according to the unit?", "options": ["Only the manufacturer's", "Only the investor's", "Only the loudest teammate's", "The user's"], "answer": 3, "explanation": "The notes stress the user's side.", "page": 15, "topic": "Design Thinking principles", "source": "pdf", "unit": 1, "id": "U1-072"}, {"q": "How does the unit say ideas improve?", "options": ["By being tested", "By being argued about indefinitely", "By being protected from feedback", "By being selected solely on prestige"], "answer": 0, "explanation": "Testing creates evidence for refinement.", "page": 15, "topic": "Design Thinking principles", "source": "pdf", "unit": 1, "id": "U1-073"}, {"q": "Why is early failure considered useful?", "options": ["It proves the user is wrong", "It is cheaper than discovering failure late", "It removes all future uncertainty", "It guarantees a successful launch"], "answer": 1, "explanation": "Early learning avoids costlier late failure.", "page": 15, "topic": "Design Thinking principles", "source": "pdf", "unit": 1, "id": "U1-074"}, {"q": "Which outcome fits Design Thinking's focus?", "options": ["Novelty without utility", "Complexity for its own sake", "Practical effective solutions for users", "Unchangeable initial plans"], "answer": 2, "explanation": "The definition emphasises practical and effective solutions.", "page": 15, "topic": "Design Thinking principles", "source": "pdf", "unit": 1, "id": "U1-075"}, {"q": "Which action best reflects a human-centred decision?", "options": ["Choose solely by technical elegance", "Ignore users after the first meeting", "Assume the designer's preferences are universal", "Check how a proposed change affects user needs"], "answer": 3, "explanation": "User needs remain central to decisions.", "page": 15, "topic": "Design Thinking principles", "source": "pdf", "unit": 1, "id": "U1-076"}, {"q": "Who is associated with the term wicked problems in the unit timeline?", "options": ["Rittel", "Alexander Graham Bell", "Dr. V", "Mendeleev"], "answer": 0, "explanation": "The timeline links Rittel with wicked problems.", "page": 16, "topic": "History and Lawson", "source": "pdf", "unit": 1, "id": "U1-077"}, {"q": "Who is linked to design as a way of thinking in 1969–70s?", "options": ["Nigel Cross", "Herbert Simon", "Peter Rowe", "Dr. V"], "answer": 1, "explanation" y understands user needs and challenges?", "options": ["Empathize", "Define", "Ideate", "Prototype"], "answer": 0, "explanation": "Empathize develops understanding of users.", "page": 17, "topic": "Stanford framework", "source": "pdf", "unit": 1, "id": "U1-085"}, {"q": "Which stage pinpoints the core problem?", "options": ["Test", "Define", "Prototype", "Ideate"], "answer": 1, "explanation": "Define states the core problem.", "page": 17, "topic": "Stanford framework", "source": "pdf", "unit": 1, "id": "U1-086"}, {"q": "Which stage generates many possible ideas?", "options": ["Define", "Empathize", "Ideate", "Test"], "answer": 2, "explanation": "Ideate expands possible solutions.", "page": 17, "topic": "Stanford framework", "source": "pdf", "unit": 1, "id": "U1-087"}, {"q": "Which stage builds a simple model of an idea?", "options": ["Empathize", "Define", "Ideate", "Prototype"], "answer": 3, "explanation": "A prototype makes an idea tangible.", "page": 17, "topic": "Stanford framework", "source": "pdf", "unit": 1, "id": "U1-088"}, {"q": "Which stage evaluates and refines ideas with users?", "options": ["Test", "Define", "Ideate", "Empathize only"], "answer": 0, "explanation": "Testing gathers user evidence.", "page": 17, "topic": "Stanford framework", "source": "pdf", "unit": 1, "id": "U1-089"}, {"q": "What is the stated five-stage sequence?", "options": ["Define, Ship, Empathize, Price, Test", "Empathize, Define, Ideate, Prototype, Test", "Prototype, Ship, Define, Ideate, Ignore", "Ideate, Manufacture, Price, Advertise, Ship"], "answer": 1, "explanation": "This is the Stanford sequence in the notes.", "page": 17, "topic": "Stanford framework", "source": "pdf", "unit": 1, "id": "U1-090"}, {"q": "What does the feedback arrow from testing signify?", "options": ["Testing permanently ends learning", "Empathy is unnecessary after launch", "The process can return to earlier understanding", "Stages must never be revisited"], "answer": 2, "explanation": "Testing feeds back one", "Outside all three lenses", "At desirability alone"], "answer": 0, "explanation": "It requires all three together.", "page": 18, "topic": "IDEO lenses", "source": "pdf", "unit": 1, "id": "U1-097"}, {"q": "A desired and buildable service cannot sustain its costs. Which lens is lacking?", "options": ["Desirability", "Viability", "Feasibility", "Ideation"], "answer": 1, "explanation": "Unsustainable costs are a viability issue.", "page": 18, "topic": "IDEO lenses", "source": "pdf", "unit": 1, "id": "U1-098"}, {"q": "A profitable technical concept has no interested users. Which lens is lacking?", "options": ["Viability", "Feasibility", "Desirability", "Prototyping"], "answer": 2, "explanation": "User interest belongs to desirability.", "page": 18, "topic": "IDEO lenses", "source": "pdf", "unit": 1, "id": "U1-099"}, {"q": "Users want a financially sound solution, but technology cannot deliver it. Which lens is lacking?", "options": ["Desirability", "Viability", "Observation", "Feasibility"], "answer": 3, "explanation": "Whether it can be built is feasibility.", "page": 18, "topic": "IDEO lenses", "source": "pdf", "unit": 1, "id": "U1-100"}, {"q": "How does the conclusion relate Stanford and IDEO frameworks?", "options": ["They are complementary", "They are mutually exclusive", "They describe only manufacturing", "They eliminate iteration"], "answer": 0, "explanation": "Stages and lenses offer complementary perspectives.", "page": 18, "topic": "IDEO lenses", "source": "pdf", "unit": 1, "id": "U1-101"}, {"q": "How is waterfall organised in the course comparison?", "options": ["Feedback reshapes every stage repeatedly", "Each phase finishes before the next", "Empathy and testing form a continuous loop", "User research replaces all planning"], "answer": 1, "explanation": "Waterfall is linear and sequential.", "page": 19, "topic": "Waterfall and HCD", "source": "pdf", "unit": 1, "id": "U1-102"}, {"q": "When does user feedback arrive in the unit's waterfall comparison?", ngs were low"], "answer": 3, "explanation": "Data showed what was happening but not why.", "page": 20, "topic": "Airbnb case", "source": "pdf", "unit": 1, "id": "U1-108"}, {"q": "How did founders uncover the photography issue?", "options": ["They visited hosts personally in New York", "They chose features without user contact", "They only changed database architecture", "They avoided viewing listings"], "answer": 0, "explanation": "Direct visits exposed poor photographs.", "page": 20, "topic": "Airbnb case", "source": "pdf", "unit": 1, "id": "U1-109"}, {"q": "What intervention did the founders perform?", "options": ["They removed every photograph", "They photographed listings themselves", "They stopped speaking with hosts", "They redesigned cataract surgery"], "answer": 1, "explanation": "They rented a camera and improved photos.", "page": 20, "topic": "Airbnb case", "source": "pdf", "unit": 1, "id": "U1-110"}, {"q": "What design lesson does the case support?", "options": ["Metrics always explain behaviour fully", "Only technically complex changes create value", "Direct observation can reveal causes hidden behind metrics", "Every first experiment must scale immediately"], "answer": 2, "explanation": "Visits uncovered an actionable issue.", "page": 20, "topic": "Airbnb case", "source": "pdf", "unit": 1, "id": "U1-111"}, {"q": "Why is the hands-on photography intervention notable?", "options": ["It required no user understanding", "It proved all listings identical", "It made further learning unnecessary", "A simple empathy-driven action could test an insight"], "answer": 3, "explanation": "The intervention was informed by observation.", "page": 20, "topic": "Airbnb case", "source": "pdf", "unit": 1, "id": "U1-112"}, {"q": "Which social concern contributed to Google Glass difficulties in the case?", "options": ["People disliked being recorded", "People demanded printed manuals", "Users lacked cataract surgery", "Hosts lacked property photographs"], "answer": 0, "explanation": "Recording concerns undermined desirability.", "page": 21, "topic": "Google Glass case", "source": "pdf", "unit": 1, "id": "U1-113"}, {"q": "What price is cited for the original Google Glass offering?", "options": ["$150", "$1,500", "$15", "$15,000"], "answer": 1, "explanation": "The unit cites $1,500.", "page": 21, "topic": "Google Glass case", "source": "pdf", "unit": 1, "id": "U1-114"}, {"q": "Which lesson follows from consumer Glass?", "options": ["Feasibility alone guarantees success", "Every wearable must fail", "Technical sophistication does not ensure desirability", "Testing is irrelevant to technology"], "answer": 2, "explanation": "Advanced technology did not guarantee user fit.", "page": 21, "topic": "Google Glass case", "source": "pdf", "unit": 1, "id": "U1-115"}, {"q": "Which group is named for Glass Enterprise Edition?", "options": ["Only vacation property hosts", "Only primary-school teachers", "Only cataract patients", "Warehouse and factory technicians"], "answer": 3, "explanation": "The example targets technicians.", "page": 21, "topic": "Google Glass case", "source": "pdf", "unit": 1, "id": "U1-116"}, {"q": "Why did the enterprise context offer a clearer use case?", "options": ["Workers could benefit from hands-free operation", "Workers needed listing photos", "Workers wanted a VARK test", "Workers required comfort pricing tiers"], "answer": 0, "explanation": "Hands-free work addressed a concrete need.", "page": 21, "topic": "Google Glass case", "source": "pdf", "unit": 1, "id": "U1-117"}, {"q": "What does 'good or bad for someone' emphasise?", "options": ["All user groups have identical needs", "Product value depends on user and context", "Price is the only design criterion", "Products cannot be evaluated"], "answer": 1, "explanation": "Technology can fit different contexts differently.", "page": 21, "topic": "Google Glass case", "source": "pdf", "unit": 1, "id": "U1-118"}, {"q": "Who founded Aravind according to the course case?", "optio t commits to a solution before understanding needs", "It uses too much iteration", "It considers too many problem statements"], "answer": 1, "explanation": "Feature surveys after product selection do not establish the real need.", "page": 24, "topic": "Recognising Design Thinking", "source": "pdf", "unit": 1, "id": "U1-130"}, {"q": "A team counts mess-queue waiting times before proposing a solution. What does this illustrate?", "options": ["Technology-first commitment", "Premature judgment", "Observation before solution selection", "Avoidance of user context"], "answer": 2, "explanation": "Observation precedes deciding what to build.", "page": 24, "topic": "Recognising Design Thinking", "source": "pdf", "unit": 1, "id": "U1-131"}, {"q": "Users reject three prototypes and the team changes its problem statement. What does this demonstrate?", "options": ["A requirement to preserve the original plan", "Preference for architecture alone", "Functional fixedness", "Iterative learning"], "answer": 3, "explanation": "Feedback can justify revisiting the definition.", "page": 24, "topic": "Recognising Design Thinking", "source": "pdf", "unit": 1, "id": "U1-132"}, {"q": "Residents complain about food, but interviews reveal uncertainty about the menu. What has research enabled?", "options": ["Reframing the real problem", "Proof that interviews are unnecessary", "Automatic selection of technology", "Elimination of feedback"], "answer": 0, "explanation": "Research separates a complaint from its underlying need.", "page": 24, "topic": "Recognising Design Thinking", "source": "pdf", "unit": 1, "id": "U1-133"}, {"q": "Which question is central when evaluating a badly designed campus feature?", "options": ["Which brand is most prestigious?", "Who suffers, and what change would help?", "Can the design remain unchanged forever?", "How can users be ignored?"], "answer": 1, "explanation": "The activity asks who suffers and what change could help.", "page": 25, "topic": "Observation and practice", "source": "pdf", "unit": 1, "id": "U1-134"}, {"q": "In the mini design sprint, what comes before empathy?", "options": ["Shipping the product", "Choosing a selling price", "Listing the object's properties", "Testing a production system"], "answer": 2, "explanation": "The activity begins with properties.", "page": 27, "topic": "Observation and practice", "source": "pdf", "unit": 1, "id": "U1-135"}, {"q": "What is the deeper skill of Design Detective?", "options": ["Memorising campus brands", "Choosing technology without evidence", "Avoiding familiar environments", "Noticing previously overlooked human experiences"], "answer": 3, "explanation": "The unit emphasises a shift in attention.", "page": 25, "topic": "Observation and practice", "source": "pdf", "unit": 1, "id": "U1-136"}, {"q": "Which sequence captures the closing design habit?", "options": ["Notice, Question, Reframe, Create, Deliver Value", "Build, Ignore, Defend, Ship, Forget", "Price, Advertise, Copy, Reject, Stop", "Conform, Memorise, Assume, Argue, Finish"], "answer": 0, "explanation": "The closing synthesis links noticing to value.", "page": 28, "topic": "Observation and practice", "source": "pdf", "unit": 1, "id": "U1-137"}, {"q": "What is metacognition most closely concerned with in this learning context?", "options": ["Only the cost of a prototype", "Awareness of one's own thinking", "Manufacturing optical lenses", "Choosing a company's logo"], "answer": 1, "explanation": "Tracking mental processes supports metacognition.", "page": 3, "topic": "Applying foundational principles", "source": "pdf", "unit": 1, "id": "U1-138"}, {"q": "In the capstone, which action follows identifying who struggles with an object?", "options": ["Ship the first idea immediately", "Avoid considering alternatives", "State the real problem in one line", "Choose a final advertising slogan"], "answer": 2, "explanation": "Empathy is followed by defining the problem.", "page": 27, "topic": "Applying foundational principles", "source": "pdf", "unit": 1, "id": "U1-139"}, {"q": "How many alternative versions are requested in the capstone ideation step?", "options": ["One", "Ten", "Twenty-eight", "Three"], "answer": 3, "explanation": "The activity asks for three wild alternative versions.", "page": 27, "topic": "Applying foundational principles", "source": "pdf", "unit": 1, "id": "U1-140"}, {"q": "What is the intended length of the capstone pitch?", "options": ["Thirty seconds", "Thirty minutes", "Two hours", "One full day"], "answer": 0, "explanation": "The notes specify a thirty-second pitch.", "page": 27, "topic": "Applying foundational principles", "source": "pdf", "unit": 1, "id": "U1-141"}, {"q": "When analysing a successful design, which question should be included?", "options": ["Was the designer's first guess never changed?", "What problem did it solve and for whom?", "Could user research have been avoided?", "Did it contain the maximum number of parts?"], "answer": 1, "explanation": "Success analysis connects a solution to its users and problem.", "page": 26, "topic": "Applying foundational principles", "source": "pdf", "unit": 1, "id": "U1-142"}, {"q": "When analysing a failed design, which question fits the unit's extended challenge?", "options": ["How can feedback be permanently excluded?", "How can every user be blamed?", "How could better user research have helped?", "How can the original assumption be protected?"], "answer": 2, "explanation": "The activity asks how better research might have prevented failure.", "page": 26, "topic": "Applying foundational principles", "source": "pdf", "unit": 1, "id": "U1-143"}, {"q": "Which campus item can be studied in Design Detective?", "options": ["Only a patented electronic device", "Only a manufactured object with a brand", "Only an item sold commercially", "A queue that people have to use"], "answer": 3, "explanation": "The activity includes services and experiences such as queues.", "page": 25, "topic": "Applying foundational principles", "source": "pdf", "unit": 1, "id": "U1-144"}, {"q": "What should an evaluation of a well-designed campus object identify?", "options": ["Who uses it and why it works", "Only its purchase date", "Only its colour", "Only its manufacturer"], "answer": 0, "explanation": "The activity evaluates design in relation to users.", "page": 25, "topic": "Applying foundational principles", "source": "pdf", "unit": 1, "id": "U1-145"}, {"q": "A team chooses its solution solely for the best technical architecture. Which omission matters most?", "options": ["A sufficiently long product name", "Evidence that it addresses user needs", "An expensive launch event", "A guarantee that no prototype will change"], "answer": 1, "explanation": "Architecture alone does not establish human-centred fit.", "page": 24, "topic": "Applying foundational principles", "source": "pdf", "unit": 1, "id": "U1-146"}, {"q": "Which quality is preserved across Aravind's comfort tiers in the course account?", "options": ["The room's comfort level", "Every nonmedical amenity", "The quality of surgery", "The amount each patient pays"], "answer": 2, "explanation": "Cross-subsidy changes comfort rather than surgical quality.", "page": 23, "topic": "Applying foundational principles", "source": "pdf", "unit": 1, "id": "U1-147"}, {"q": "What does Aravind's case mean by dignity as a design requirement?", "options": ["Only paying patients receive skilled care", "Low-cost care must reduce treatment quality", "Patients should receive no information", "Free patients receive the same surgery and surgeons"], "answer": 3, "explanation": "The case protects equal clinical care despite different payment tiers.", "page": 23, "topic": "Applying foundational principles", "source": "pdf", "unit": 1, "id": "U1-148"}, {"q": "Which learner action most closely supports the unit's self-awareness objective?", "options": ["Reflecting on when and how insights occur", "Treating every first thought as correct", "Copying others only to fit in", "Avoiding questions about one's own habits"], "answer": 0, "explanation": "Reflection helps learners understand their thinking habits.", "page": 6, "topic": "Applying foundational principles", "source": "pdf", "unit": 1, "id": "U1-149"}, {"q": "Which question best starts an empathy-based redesign of an everyday object?", "options": ["Which technology can we add regardless of need?", "Who struggles with this object, and why?", "What solution can we choose before observation?", "How can we prevent users from changing our idea?"], "answer": 1, "explanation": "The capstone explicitly asks who struggles and why.", "page": 27, "topic": "Applying foundational principles", "source": "pdf", "unit": 1, "id": "U1-150"}, {"q": "Which description best defines learning in the supplementary notes?", "options": ["Only a brief change in mood", "Merely seeing a page once", "A lasting change in knowledge, skill or behaviour", "Only receiving a certificate"], "answer": 2, "explanation": "Learning involves a relatively lasting change.", "page": 0, "topic": "Learning and cognition (web supplement)", "source": "web", "unit": 1, "id": "U1-151"}, {"q": "Which memory system temporarily holds a limited amount of information?", "options": ["Long-term memory", "An unlimited archive", "An external notebook", "Working memory"], "answer": 3, "explanation": "Working memory has limited temporary capacity.", "page": 0, "topic": "Learning and cognition (web supplement)", "source": "web", "unit": 1, "id": "U1-152"}, {"q": "What is retrieval?", "options": ["Bringing stored information back to mind", "Presenting confusing information", "Removing all prior knowledge", "Only seeing information for the first time"], "answer": 0, "explanation": "Retrieval accesses stored information.", "page": 0, "topic": "Learning and cognition (web supplement)", "source": "web", "unit": 1, "id": "U1-153"}, {"q": "Grouping related elements into a meaningful unit is called what?", "options": ["Conformity", "Chunking", "Cross-subsidy", "Premature judgment"], "answer": 1, "explanation": "Chunking organises separate elements into meaningful groups.", "page": 0, "topic": "Learning and cognition (web supplement)", "source": "web", "unit": 1, "id": "U1-154"}, {"q": "Which term describes the brain's capacity to change with experience?", "options": ["Economic viability", "Functional fixedness", "Neuroplasticity", "Vertical integration"], "answer": 2, "explanation": "Neuroplasticity concerns experience-related brain change.", "page": 0, "topic": "Learning and cognition (web supplement)", "source": "web", "unit": 1, "id": "U1-155"}, {"q": "Which process can sleep support after learning?", "options": ["Elimination of the need to study", "Automatic mastery of unseen topics", "Permanent removal of forgetting", "Memory consolidation"], "answer": 3, "explanation": "Sleep supports consolidation of learned material.", "page": 0, "topic": "Learning and cognition (web supplement)", "source": "web", "unit": 1, "id": "U1-156"}, {"q": "Which load is associated with the inherent complexity of a task?", "options": ["Intrinsic", "Extraneous", "Financial", "Social conformity"], "answer": 0, "explanation": "Intrinsic load concerns task complexity.", "page": 0, "topic": "Cognitive load (web supplement)", "source": "web", "unit": 1, "id": "U1-157"}, {"q": "A confusing layout adds difficulty unrelated to the content. Which load increases?", "options": ["Intrinsic only", "Extraneous", "Economic", "Kinesthetic"], "answer": 1, "explanation": "Unnecessary presentation demands create extraneous load.", "page": 0, "topic": "Cognitive load (web supplement)", "source": "web", "unit": 1, "id": "U1-158"}, {"q": "Effort devoted to building useful mental schemas is described as what in the notes?", "options": ["Functional fixedness", "Authority bias", "Germane effort", "Cross-subsidy"], "answer": 2, "explanation": "Germane effort supports schema construction.", "page": 0, "topic": "Cognitive load (web supplement)", "source": "web", "unit": 1, "id": "U1-159"}, {"q": "Which sequence matches Kolb's experiential cycle?", "options": ["Experimentation, shipping, pricing, advertising", "Remember, understand, apply, analyse", "Desirability, feasibility, viability, profit", "Experience, reflection, conceptualisation, experimentation"], "answer": 3, "explanation": "Kolb links experience with reflection, concepts and experiments.", "page": 0, "topic": "Kolb and Bloom (web supplement)", "source": "web", "unit": 1, "id": "U1-160"}, {"q": "In Kolb's cycle, looking back thoughtfully on an experience is what?", "options": ["Reflective observation", "Active experimentation", "Abstract conceptualisation only", "Product delivery"], "answer": 0, "explanation": "Reflective observation examines experience.", "page": 0, "topic": "Kolb and Bloom (web supplement)", "source": "web", "unit": 1, "id": "U1-161"}, {"q": "Which is the highest listed level in revised Bloom's taxonomy?", "options": ["Remember", "Create", "Understand", "Apply"], "answer": 1, "explanation": "Create is the final listed level.", "page": 0, "topic": "Kolb and Bloom (web supplement)", "source": "web", "unit": 1, "id": "U1-162"}, {"q": "Which Bloom level involves judging alternatives using criteria?", "options": ["Remember", "Understand", "Evaluate", "Encode"], "answer": 2, "explanation": "Evaluation makes judgments using criteria.", "page": 0, "topic": "Kolb and Bloom (web supplement)", "source": "web", "unit": 1, "id": "U1-163"}, {"q": "In the Hear–Create–Deliver variant, which stage emphasises contextual research?", "options": ["Deliver", "Create only", "Viability", "Hear"], "answer": 3, "explanation": "Hear develops understanding of people and context.", "page": 0, "topic": "Additional design frameworks (web supplement)", "source": "web", "unit": 1, "id": "U1-164"}, {"q": "In the Hear–Create–Deliver variant, which stage considers operating and financial models?", "options": ["Deliver", "Hear", "Observe only", "Empathize only"], "answer": 0, "explanation": "Deliver concerns bringing the solution into operation.", "page": 0, "topic": "Additional design frameworks (web supplement)", "source": "web", "unit": 1, "id": "U1-165"}, {"q": "Which sequence is the IDEO process variant identified in the linked MCQ scope?", "options": ["Desirability, Feasibility, Viability", "Inspiration, Ideation, Implementation", "Remember, Understand, Apply", "Hear, Test, Archive"], "answer": 1, "explanation": "These are the stated process labels, distinct from lenses.", "page": 0, "topic": "Additional design frameworks (web supplement)", "source": "web", "unit": 1, "id": "U1-166"}, {"q": "What distinguishes participatory design?", "options": ["Users are excluded until launch", "Only engineers choose needs", "Users collaborate in designing", "Research is replaced by marketing"], "answer": 2, "explanation": "Participation involves users as collaborators.", "page": 0, "topic": "Additional design frameworks (web supplement)", "source": "web", "unit": 1, "id": "U1-167"}, {"q": "How does radical change differ from incremental improvement?", "options": ["It always means a minor adjustment", "It must avoid all new approaches", "It is identical to routine maintenance", "It makes a substantial departure from what exists"], "answer": 3, "explanation": "Radical change is a major departure rather than a small improvement.", "page": 0, "topic": "Additional design frameworks (web supplement)", "source": "web", "unit": 1, "id": "U1-168"}, {"q": "What is the central design lesson of the supplementary New Coke case?", "options": ["Emotional attachment can be overlooked by product research", "Technical feasibility alone ensures acceptance", "All preferences remain identical forever", "Price is the only source of user value"], "answer": 0, "explanation": "The case highlights emotional meaning beyond functional comparisons.", "page": 0, "topic": "Additional cases and barriers (web supplement)", "source": "web", "unit": 1, "id": "U1-169"}, {"q": "Which combination reflects the access lesson of the M-Pesa example?", "options": ["Only expensive unfamiliar hardware", "Familiar phones and agents", "Removing local support entirely", "Requiring every user to visit a distant bank"], "answer": 1, "explanation": "The example connects familiar technology and agents with access.", "page": 0, "topic": "Additional cases and barriers (web supplement)", "source": "web", "unit": 1, "id": "U1-170"}, {"q": "A team accepts an idea mainly because a senior person proposed it. Which bias is illustrated?", "options": ["Functional fixedness", "Intrinsic load", "Authority bias", "Analogous inspiration"], "answer": 2, "explanation": "Authority bias gives undue weight to the proposer's status.", "page": 0, "topic": "Additional cases and barriers (web supplement)", "source": "web", "unit": 1, "id": "U1-171"}, {"q": "Which combination represents barriers in the supplementary Segway example?", "options": ["Memory consolidation and chunking", "Cross-subsidy and village screening", "Poor rental listing photographs only", "Price, regulation and unclear use case"], "answer": 3, "explanation": "The case highlights practical adoption barriers.", "page": 0, "topic": "Additional cases and barriers (web supplement)", "source": "web", "unit": 1, "id": "U1-172"}, {"q": "Why observe shoppers while redesigning a shopping cart?", "options": ["To discover actual use and safety needs", "To eliminate all contact with users", "To select solely by appearance", "To prove an untested design correct"], "answer": 0, "explanation": "Observation reveals behaviour and safety concerns.", "page": 0, "topic": "Additional cases and barriers (web supplement)", "source": "web", "unit": 1, "id": "U1-173"}, {"q": "Empathy in design means understanding a situation primarily from whose perspective?", "options": ["The user’s", "The investor’s only", "The designer’s only", "The competitor’s"], "answer": 0, "explanation": "Empathy sees the world from the user’s point of view.", "page": 5, "topic": "Empathy", "unit": 2, "id": "U2-001"}, {"q": "Which set best represents what empathy investigates?", "options": ["Brands, prices, logos and slogans", "Thoughts, feelings, statements and actions", "Revenue, taxes, assets and liabilities", "Code, servers, networks and storage"], "answer": 1, "explanation": "The notes emphasise what users think, feel, say and do.", "page": 5, "topic": "Empathy", "unit": 2, "id": "U2-002"}, {"q": "A teacher asks why learners struggle online before proposing changes. What is demonstrated?", "options": ["Competitive imitation", "Statistical validation", "Empathy", "Premature implementation"], "answer": 2, "explanation": "Understanding the learner’s experience is an empathic approach.", "page": 5, "topic": "Empathy", "unit": 2, "id": "U2-003"}, {"q": "What is a central benefit of empathy for problem identification?", "options": ["Eliminating research", "Guaranteeing a feature will succeed", "Making designer preferences decisive", "Revealing hidden needs"], "answer": 3, "explanation": "Empathy uncovers needs that may otherwise remain hidden.", "page": 5, "topic": "Empathy", "unit": 2, "id": "U2-004"}, {"q": "Which behaviour demonstrates the listening part of empathy?", "options": ["Attending to users’ stories", "Preparing rebuttals while users speak", "Replacing interviews with guesses", "Explaining why users are mistaken"], "answer": 0, "explanation": "Listening to experiences reveals real needs.", "page": 6, "topic": "Empathy habit", "unit": 2, "id": "U2-005"}, {"q": "Building trust with users represents which empathy benefit?", "options": ["Elimination of testing", "Stronger connections", "Automatic market dominance", "Removal of all uncertainty"], "answer": 1, "explanation": "The notes connect empathy with trust.", "page": 6, "topic": "Empathy habit", "unit": 2, "id": "U2-006"}, {"q": "Discovering a difficulty users never formally reported illustrates what?", "options": ["Selecting revenue models", "Finalising code", "Revealing hidden problems", "Standardising numeric scales"], "answer": 2, "explanation": "Empathy can uncover unreported problems.", "page": 6, "topic": "Empathy habit", "unit": 2, "id": "U2-007"}, {"q": "“That must be awful for them,” expressed from a distance, best illustrates what?", "options": ["Empathic observation", "Compassionate action", "Quantitative research", "Sympathy"], "answer": 3, "explanation": "Sympathy means feeling for someone from a distance.", "page": 7, "topic": "Sympathy empathy compassion", "unit": 2, "id": "U2-008"}, {"q": "Following new students to understand confusing block numbers illustrates what?", "options": ["Empathy", "Sympathy alone", "Feature prioritisation", "Financial analysis"], "answer": 0, "explanation": "The researcher understands the situation as students experience it.", "page": 7, "topic": "Sympathy empathy compassion", "unit": 2, "id": "U2-009"}, {"q": "Understanding navigation anxiety and deciding to improve signage demonstrates what?", "options": ["Archetype segmentation", "Compassion", "Sympathy alone", "Passive observation"], "answer": 1, "explanation": "Compassion combines empathy with a decision to act.", "page": 7, "topic": "Sympathy empathy compassion", "unit": 2, "id": "U2-010"}, {"q": "Which distinction matches the notes?", "options": ["Compassion excludes understanding", "Empathy means accepting every request", "Compassion includes a decision to act", "Empathy requires distance"], "answer": 2, "explanation": "Action added to understanding distinguishes compassion.", "page": 7, "topic": "Sympathy empathy compassion", "unit": 2, "id": "U2-011"}, {"q": "Why is “I am a student, so I know what all students need” problematic?", "options": ["It includes too many viewpoints", "It uses an excessively large sample", "It validates a hypothesis quantitatively", "It treats one experience as the whole sample"], "answer": 3, "explanation": "One designer cannot represent every user.", "page": 8, "topic": "You are not the user", "unit": 2, "id": "U2-012"}, {"q": "How should designers treat personal experience?", "options": ["As a hypothesis to check", "As conclusive evidence", "As a research replacement", "As an automatically representative sample"], "answer": 0, "explanation": "Personal experience suggests hypotheses requiring checking.", "page": 8, "topic": "You are not the user", "unit": 2, "id": "U2-013"}, {"q": "Which step best challenges a designer’s assumptions?", "options": ["Build immediately from intuition", "Consult other users", "Ask only themselves again", "Remove conflicting observations"], "answer": 1, "explanation": "The notes recommend checking beliefs with others.", "page": 8, "topic": "You are not the user", "unit": 2, "id": "U2-014"}, {"q": "Computational empathy applies empathy primarily to what?", "options": ["Warehouse valuation", "Mechanical calibration only", "Software development", "Tax accounting"], "answer": 2, "explanation": "It concerns systems responding to behaviour and emotions.", "page": 9, "topic": "Computational empathy", "unit": 2, "id": "U2-015"}, {"q": "An educational app adapting to learner performance illustrates what?", "options": ["Financial pain", "A physical environment audit", "A demographic-only persona", "Computational empathy"], "answer": 3, "explanation": "Performance adaptation is an example in the notes.", "page": 9, "topic": "Computational empathy", "unit": 2, "id": "U2-016"}, {"q": "Which behaviour is associated with healthcare applications in the notes?", "options": ["Monitoring well-being", "Renumbering campus wings", "Measuring printer ink density", "Assigning interview pseudonyms"], "answer": 0, "explanation": "Monitoring well-being is the healthcare example.", "page": 9, "topic": "Computational empathy", "unit": 2, "id": "U2-017"}, {"q": "A chatbot responding appropriately to user intent illustrates what?", "options": ["Physical-only observation", "Computational empathy", "Inventory control", "Closed-ended sampling lips", "Decorative colours", "Mandatory social-media posts", "QR-verifiable certificates"], "answer": 3, "explanation": "The response included QR-verifiable certificates.", "page": 10, "topic": "CoWIN", "unit": 2, "id": "U2-024"}, {"q": "What inclusion lesson does CoWIN illustrate?", "options": ["Design for the least-connected user", "Assume recent smartphones", "Remove assistance", "Ignore language diversity"], "answer": 0, "explanation": "Least-connected users and assisted pathways are central.", "page": 10, "topic": "CoWIN", "unit": 2, "id": "U2-025"}, {"q": "User research studies which set?", "options": ["Only execution speed", "Needs, behaviours, goals and challenges", "Only preferred colours", "Only advertising spending"], "answer": 1, "explanation": "The definition includes all four human concerns.", "page": 11, "topic": "User research", "unit": 2, "id": "U2-026"}, {"q": "When should user research inform design?", "options": ["Only after fixing the interface", "After assuming all needs", "Before creating solutions", "Only after failed launch"], "answer": 2, "explanation": "Research gathers information before solution creation.", "page": 11, "topic": "User research", "unit": 2, "id": "U2-027"}, {"q": "What does user research reduce?", "options": ["The value of evidence", "The relevance of motivation", "The importance of goals", "Unsupported assumptions"], "answer": 3, "explanation": "Research supports evidence-based decisions.", "page": 11, "topic": "User research", "unit": 2, "id": "U2-028"}, {"q": "Which is an appropriate user-research question?", "options": ["What motivates users?", "What do I personally enjoy most?", "How can we ignore unexpected findings?", "How do we prove users wrong?"], "answer": 0, "explanation": "Motivation is a research concern in the notes.", "page": 11, "topic": "User research", "unit": 2, "id": "U2-029"}, {"q": "Which research type primarily explores why and how?", "options": ["Inventory counting", "Qualitative", "Quantitative",
