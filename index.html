 time?", "How do you currently do this?", "Do you think this app is difficult?"], "answer": 3, "explanation": "It suggests difficulty before exploration.", "page": 30, "topic": "Unbiased interviews", "unit": 2, "id": "U2-112"}, {"q": "What should be observed besides spoken answers?", "options": ["Body language and emotions", "Only old researcher notes", "Only the app logo", "Only marketing slogans"], "answer": 0, "explanation": "Nonverbal behaviour supplies context.", "page": 30, "topic": "Unbiased interviews", "unit": 2, "id": "U2-113"}, {"q": "“The library is too crowded” is treated as what?", "options": ["A conclusion about every library", "A symptom needing deeper inquiry", "The final root cause", "An immediate building requirement"], "answer": 1, "explanation": "The ladder continues beyond crowding.", "page": 31, "topic": "Five Whys case", "unit": 2, "id": "U2-114"}, {"q": "What concern emerged after noise was mentioned?", "options": ["A different logo", "Longer queues", "Difficulty concentrating", "More advertising"], "answer": 2, "explanation": "The concern shifted from space to focus.", "page": 31, "topic": "Five Whys case", "unit": 2, "id": "U2-115"}, {"q": "Which systemic cause appears in the library ladder?", "options": ["Desk colour", "Bag brand", "Number of fictional personas", "Memorisation-heavy evaluation"], "answer": 3, "explanation": "Evaluation emphasising memorisation is the systemic issue.", "page": 31, "topic": "Five Whys case", "unit": 2, "id": "U2-116"}, {"q": "What need ultimately reframed the case?", "options": ["Feeling study time is well spent", "Owning a larger phone", "More promotional notifications", "Installing a large printer"], "answer": 0, "explanation": "The emotional core concerns worthwhile learning.", "page": 31, "topic": "Five Whys case", "unit": 2, "id": "U2-117"}, {"q": "What is wrong with “Most students say Wi-Fi is bad. Agree?”?", "options": ["It explores a routine without influence", "It leads using others’ opinions", "It neutrally invites a story", "It is direct observation"], "answer": 1, "explanation": "The wording primes negative agreement.", "page": 32, "topic": "Interview mistakes", "unit": 2, "id": "U2-118"}, {"q": "Why is “Why don’t you just go earlier?” problematic?", "options": ["It neutrally requests demonstration", "It guarantees consent", "It gives judgmental advice", "It always creates statistical evidence"], "answer": 2, "explanation": "It assumes an easy fix and can damage openness.", "page": 32, "topic": "Interview mistakes", "unit": 2, "id": "U2-119"}, {"q": "What is an explicit need?", "options": ["An unspoken inferred concern", "A fictional demographic", "The interviewer’s favourite feature", "A clearly stated want"], "answer": 3, "explanation": "Explicit needs are expressed directly.", "page": 33, "topic": "Needs", "unit": 2, "id": "U2-120"}, {"q": "What is an implicit need?", "options": ["An often-unspoken need inferred through research", "Any feature request", "An unsupported guess treated as fact", "A mandatory demographic field"], "answer": 0, "explanation": "Observation and analysis reveal implicit needs.", "page": 33, "topic": "Needs", "unit": 2, "id": "U2-121"}, {"q": "Which is an explicit example?", "options": ["An inferred need for comfort", "I want faster checkout", "An inferred need for control", "Unspoken trust concerns"], "answer": 1, "explanation": "The user states a desired improvement.", "page": 33, "topic": "Needs", "unit": 2, "id": "U2-122"}, {"q": "What implicit need may underlie faster checkout in the notes?", "options": ["Longer forms", "More mandatory steps", "Feeling in control", "Owning more devices"], "answer": 2, "explanation": "The example connects checkout to control.", "page": 33, "topic": "Needs", "unit": 2, "id": "U2-123"}, {"q": "Which pair contains implicit-need examples?", "options": ["Lower-price and faster-internet requests", "Larger-battery and faster-app requests", "New-button and extra-screen requests", "Confidence and trust"], "answer": 3, "explanation": "Confidence and trust can be underlying needs.", "page": 33, "topic": "Needs", "unit": 2, "id": "U2-124"}, {"q": "Why can implicit needs support innovative solutions?", "options": ["Users may be unable to articulate them", "All stated requests must be rejected", "Observation removes evidence requirements", "All users share identical motives"], "answer": 0, "explanation": "Unarticulated needs can reveal opportunities.", "page": 33, "topic": "Needs", "unit": 2, "id": "U2-125"}, {"q": "What does the say–do gap describe?", "options": ["Backend prices differing", "Reports differing from actual behaviour", "Two software versions differing", "Two sample sizes differing"], "answer": 1, "explanation": "It compares words and actions.", "page": 34, "topic": "Say do gap", "unit": 2, "id": "U2-126"}, {"q": "What mismatch appears in the coffee case?", "options": ["Refusing coffee and never drinking it", "Choosing only small cups", "Reporting light roast but choosing dark", "Requesting tea and choosing tea"], "answer": 2, "explanation": "Stated and observed roast preferences differ.", "page": 34, "topic": "Say do gap", "unit": 2, "id": "U2-127"}, {"q": "How should conflicting reports and behaviour be handled?", "options": ["Assume deliberate lying", "Discard all observation", "Use only designer preference", "Investigate both sources"], "answer": 3, "explanation": "Discrepancies invite deeper research.", "page": 34, "topic": "Say do gap", "unit": 2, "id": "U2-128"}, {"q": "Pain points arise while users try to do what?", "options": ["Accomplish a goal", "Invent fictional names", "Choose arbitrary colours", "Ignore all needs"], "answer": 0, "explanation": "They are frustrations in goal-directed activity.", "page": 35, "topic": "Pain points", "unit": 2, "id": "U2-129"}, {"q": "An inefficient procedure most directly indicates which category?", "options": ["Demographic", "Process", "Financial", "Support"], "answer": 1, "explanation": "Process concerns procedures.", "page": 35, "topic": "Pain points", "unit": 2, "id": "U2-130"}, {"q": "“The fee exceeds my budget” most directly indicates what?", "options": ["A consent issue", "Environmental observation", "Financial pain", "An archetype"], "answer": 2, "explanation": "The concern is monetary cost.", "page": 35, "topic": "Pain points", "unit": 2, "id": "U2-131"}, {"q": "No available help after a failure most directly indicates what?", "options": ["Financial pain", "Demographic pain", "Environmental pain", "Support pain"], "answer": 3, "explanation": "Support concerns missing guidance.", "page": 35, "topic": "Pain points", "unit": 2, "id": "U2-132"}, {"q": "Wasted effort from re-entering identical data most directly concerns what?", "options": ["Productivity", "Demographics", "Identity", "Consent"], "answer": 0, "explanation": "Productivity pain concerns wasted effort.", "page": 35, "topic": "Pain points", "unit": 2, "id": "U2-133"}, {"q": "What must support every recorded pain point?", "options": ["An immediate finished solution", "A quote or count as evidence", "Only researcher confidence", "A fictional biography"], "answer": 1, "explanation": "The notes require evidence.", "page": 35, "topic": "Pain points", "unit": 2, "id": "U2-134"}, {"q": "Whose overlooked experience did this case study?", "options": ["Only advertisers", "Only app-store reviewers", "Auto-rickshaw drivers", "Only investors"], "answer": 2, "explanation": "The case shifts focus to providers.", "page": 36, "topic": "Namma Yatri", "unit": 2, "id": "U2-135"}, {"q": "What was the deepest driver pain point?", "options": ["Too few colours", "Too much transparency", "Too much earnings control", "Powerlessness"], "answer": 3, "explanation": "Opaque systems undermined control.", "page": 36, "topic": "Namma Yatri", "unit": 2, "id": "U2-136"}, {"q": "Which problem did drivers face in the case?", "options": ["Unexplained algorithm changes", "Guaranteed transparent decisions", "Excessive appeal routes", "Missing rider advertisements"], "answer": 0, "explanation": "Changes arrived without warning or explanation.", "page": 36, "topic": "Namma Yatri", "unit": 2, "id": "U2-137"}, {"q": "What need appears in the Define statement?", "options": ["Higher commissions", "Predictable, dignified incomes", "Decorative splash screens", "Mandatory longer hours"], "answer": 1, "explanation": "The statement links income with dignity and control.", "page": 36, "topic": "Namma Yatri", "unit": 2, "id": "U2-138"}, {"q": "Which alternative payment model was explored?", "options": ["Charges per screen tap", "Removing driver participation", "Small subscription instead of per-fare commission", "Larger compulsory fare cuts"], "answer": 2, "explanation": "The case explores a flat subscription.", "page": 37, "topic": "Namma Yatri", "unit": 2, "id": "U2-139"}, {"q": "What is the transferable design lesson?", "options": ["Study only visible customers", "Treat providers as implementation details", "Ignore power and control", "Research providers as well as consumers"], "answer": 3, "explanation": "Provider empathy can change solutions.", "page": 37, "topic": "Namma Yatri", "unit": 2, "id": "U2-140"}, {"q": "What is a persona?", "options": ["A fictional profile grounded in research", "A wholly invented biography", "A software specification", "A sample-size formula"], "answer": 0, "explanation": "Presentation is fictional, substance is evidence-based.", "page": 38, "topic": "Personas", "unit": 2, "id": "U2-141"}, {"q": "Which set contains persona components?", "options": ["Only code dependencies", "Goals, frustrations, needs and behaviours", "Only decorative hobbies", "Only logos and colours"], "answer": 1, "explanation": "These elements connect users to design needs.", "page": 38, "topic": "Personas", "unit": 2, "id": "U2-142"}, {"q": "Small text and complex UI in the retired-teacher persona represent what?", "options": ["Temperatures", "Consent terms", "Challenges", "Sample sizes"], "answer": 2, "explanation": "They impede independent digital-service use.", "page": 38, "topic": "Personas", "unit": 2, "id": "U2-143"}, {"q": "What validates a persona detail?", "options": ["Entertainment value", "Fit with stereotypes", "Filling template space", "Traceability to real speech or behaviour"], "answer": 3, "explanation": "Personas are evidence-based summaries.", "page": 39, "topic": "Persona evidence", "unit": 2, "id": "U2-144"}, {"q": "What should happen to unsupported persona hobbies?", "options": ["Remove them", "Present them as facts", "Make them central needs", "Attribute them randomly"], "answer": 0, "explanation": "Invented decoration should be omitted.", "page": 39, "topic": "Persona evidence", "unit": 2, "id": "U2-145"}, {"q": "Where must the representative quote come from?", "options": ["A guessed statement", "A real interview", "An invented slogan", "A fictional character"], "answer": 1, "explanation": "The notes require a real quote.", "page": 39, "topic": "Persona evidence", "unit": 2, "id": "U2-146"}, {"q": "How does an archetype differ from a persona?", "options": ["It has no shared needs", "It is a product prototype", "It describes a broad group", "It requires one fictional name"], "answer": 2, "explanation": "Archetypes group users rather than profile individuals.", "page": 40, "topic": "Archetypes", "unit": 2, "id": "U2-147"}, {"q": "What do archetypes primarily help teams do?", "options": ["Replace field observation", "Specify databases", "Choose QR codes", "Segment users"], "answer": 3, "explanation": "They help understand target audiences.", "page": 40, "topic": "Archetypes", "unit": 2, "id": "U2-148"}, {"q": "Which is an archetype?", "options": ["Senior citizens sharing needs", "Ramesh’s individual profile", "Rahul’s individual profile", "One named student’s profile"], "answer": 0, "explanation": "A broad shared group is an archetype.", "page": 40, "topic": "Archetypes", "unit": 2, "id": "U2-149"}, {"q": "What are the four empathy-map categories?", "options": ["Age, Name, Address, Phone", "Says, Thinks, Does, Feels", "Cost, Revenue, Margin, Tax", "Plan, Code, Build, Deploy"], "answer": 1, "explanation": "The map integrates statements, thoughts, actions and emotions.", "page": 41, "topic": "Empathy maps", "unit": 2, "id": "U2-150"}, {"q": "Where does a direct interview quote belong?", "options": ["Does", "Feels", "Says", "Thinks"], "answer": 2, "explanation": "Says contains direct statements.", "page": 41, "topic": "Empathy maps", "unit": 2, "id": "U2-151"}, {"q": "Where does a repeated observable action belong?", "options": ["Says", "Thinks", "Feels", "Does"], "answer": 3, "explanation": "Does records behaviour.", "page": 41, "topic": "Empathy maps", "unit": 2, "id": "U2-152"}, {"q": "Where does concern about finishing a course belong?", "options": ["Thinks", "Objects", "Activities", "Environment"], "answer": 0, "explanation": "Thinks includes beliefs and concerns.", "page": 41, "topic": "Empathy maps", "unit": 2, "id": "U2-153"}, {"q": "Where does exam stress belong?", "options": ["Users exclusively", "Feels", "Says exclusively", "Objects"], "answer": 1, "explanation": "Stress is an emotion.", "page": 41, "topic": "Empathy maps", "unit": 2, "id": "U2-154"}, {"q": "Saying an app is easy but replaying lectures repeatedly should prompt what?", "options": ["Deleting the interview", "Certainty that replay means bad design", "Investigation of a possible say–do gap", "Proof of dishonesty"], "answer": 2, "explanation": "The gap suggests a research opportunity, not a proven cause.", "page": 42, "topic": "Empathy-map example", "unit": 2, "id": "U2-155"}, {"q": "What format is recommended for a problem statement?", "options": ["Product contains feature because trend", "Developer wants tool because preference", "Budget equals cost plus tax", "User needs need because insight"], "answer": 3, "explanation": "Connect a user, need and explanatory insight.", "page": 43, "topic": "Problem framing", "unit": 2, "id": "U2-156"}, {"q": "Why is “We need a mobile app” poor framing?", "options": ["It specifies a solution without user, need or insight", "It states too many human needs", "It has excessive evidence", "It identifies a precise user group"], "answer": 0, "explanation": "The solution is prematurely fixed.", "page": 43, "topic": "Problem framing", "unit": 2, "id": "U2-157"}, {"q": "In “First-years need navigation because getting lost makes them anxious,” what is the insight?", "options": ["A specific app", "Getting lost makes them anxious", "First-years", "Navigation"], "answer": 1, "explanation": "The because clause explains the need.", "page": 43, "topic": "Problem framing", "unit": 2, "id": "U2-158"}, {"q": "What is the purpose of a How Might We question?", "options": ["Replacing research", "Collecting legal names", "Reframing problems as opportunities", "Locking in an implementation"], "answer": 2, "explanation": "HMW invites creative responses to needs.", "page": 44, "topic": "HMW", "unit": 2, "id": "U2-159"}, {"q": "Why is “How might we improve education?” weak?", "options": ["It specifies a narrow button", "It includes a complete insight", "It permits only one implementation", "It is too broad"], "answer": 3, "explanation": "The scope lacks usable focus.", "page": 44, "topic": "HMW", "unit": 2, "id": "U2-160"}, {"q": "Why is “How might we add a red timetable button?” weak?", "options": ["It embeds a specific solution", "It identifies too many users", "It contains no design choice", "It is an observational count"], "answer": 0, "explanation": "The question is too narrow.", "page": 44, "topic": "HMW", "unit": 2, "id": "U2-161"}, {"q": "Which question best passes the Goldilocks test?", "options": ["How might we colour this specified button red?", "How might we help first-years navigate confidently?", "How might we fix everything?", "How might we install our exact preferred app?"], "answer": 1, "explanation": "It frames a bounded need with multiple possible responses.", "page": 44, "topic": "HMW", "unit": 2, "id": "U2-162"}, {"q": "What must precede the capstone interview?", "options": ["Inventing a quote", "Publishing the full name", "Consent", "Final implementation specification"], "answer": 2, "explanation": "The pipeline explicitly requires consent.", "page": 45, "topic": "Pipeline", "unit": 2, "id": "U2-163"}, {"q": "What completes the unit’s framing work?", "options": ["Unsupported personality traits", "A fixed app specification only", "Declaring research unnecessary", "A problem statement and suitable HMW"], "answer": 3, "explanation": "The capstone ends with challenge and opportunity framing.", "page": 45, "topic": "Pipeline", "unit": 2, "id": "U2-164"}, {"q": "Comparing interviews, observation and analytics to check a finding is called what?", "options": ["Triangulation", "Random decoration", "Solution fixation", "Demographic guessing"], "answer": 0, "explanation": "Triangulation compares evidence from different methods or sources.", "page": 0, "topic": "Triangulation", "source": "web", "unit": 2, "id": "U2-165"}, {"q": "Combining open interviews with measured completion rates is an example of what?", "options": ["A solution-only review", "Mixed-method research", "Purely qualitative research", "Persona invention"], "answer": 1, "explanation": "Mixed methods combine qualitative and quantitative evidence.", "page": 0, "topic": "Mixed methods", "source": "web", "unit": 2, "id": "U2-166"}, {"q": "Understanding another person’s perspective without necessarily sharing their emotion is what?", "options": ["Compassionate action", "Financial analysis", "Cognitive empathy", "Emotional empathy"], "answer": 2, "explanation": "Cognitive empathy concerns understanding another perspective.", "page": 0, "topic": "Empathy types", "source": "web", "unit": 2, "id": "U2-167"}, {"q": "Resonating with another person’s feelings most directly describes what?", "options": ["Numeric validation", "Demographic segmentation", "Structured sampling", "Emotional empathy"], "answer": 3, "explanation": "Emotional empathy concerns experiencing or sharing feelings.", "page": 0, "topic": "Empathy types", "source": "web", "unit": 2, "id": "U2-168"}, {"q": "A long pause before a click establishes which conclusion most safely?", "options": ["The user paused; the reason needs investigation", "The user is certainly angry", "The user definitely dislikes the brand", "The user must have a financial concern"], "answer": 0, "explanation": "Behavioural signals do not prove a specific internal emotion.", "page": 0, "topic": "Behavioural signals", "source": "web", "unit": 2, "id": "U2-169"}, {"q": "Which method is suitable for collecting users’ experiences repeatedly over several days?", "options": ["A final deployment checklist", "Diary study", "One-time logo vote", "Single static persona sketch"], "answer": 1, "explanation": "Diary studies capture experiences over time.", "page": 0, "topic": "Diary studies", "source": "web", "unit": 2, "id": "U2-170"}, {"q": "A user changes their normal behaviour because a researcher is watching. What is this?", "options": ["Behavioural segmentation", "Thematic coding", "Observer effect", "Data triangulation"], "answer": 2, "explanation": "Being observed can influence behaviour.", "page": 0, "topic": "Observer effect", "source": "web", "unit": 2, "id": "U2-171"}, {"q": "Which interview format combines a prepared guide with flexible follow-up questions?", "options": ["Fully structured", "Entirely unstructured", "Numeric analytics", "Semi-structured"], "answer": 3, "explanation": "Semi-structured interviews balance consistency and flexibility.", "page": 0, "topic": "Interview structures", "source": "web", "unit": 2, "id": "U2-172"}, {"q": "Using the same predefined questions consistently is most characteristic of what?", "options": ["Structured interviews", "Unstructured interviews", "Diary studies", "Unplanned shadowing"], "answer": 0, "explanation": "Structured interviews follow a predefined question set.", "page": 0, "topic": "Interview structures", "source": "web", "unit": 2, "id": "U2-173"}, {"q": "Which question best uses a critical-incident approach?", "options": ["What colour should our logo be?", "Describe a specific time a failed payment disrupted your plans", "Would you like our future app?", "Is technology good?"], "answer": 1, "explanation": "Critical-incident questions explore a notable concrete event.", "page": 0, "topic": "Critical incidents", "source": "web", "unit": 2, "id": "U2-174"}, {"q": "Studying a participant doing their work while explaining it is what?", "options": ["A closed preference poll", "An A/B metric calculation", "Contextual inquiry", "Fictional persona creation"], "answer": 2, "explanation": "Contextual inquiry combines real work context with explanation.", "page": 0, "topic": "Contextual inquiry", "source": "web", "unit": 2, "id": "U2-175"}, {"q": "Grouping coded interview excerpts into recurring patterns is part of what?", "options": ["Final software deployment", "Random feature generation", "Colour-palette selection", "Thematic analysis"], "answer": 3, "explanation": "Thematic analysis identifies patterns across qualitative data.", "page": 0, "topic": "Thematic analysis", "source": "web", "unit": 2, "id": "U2-176"}, {"q": "If 36 of 45 task attempts succeed, what is the completion rate?", "options": ["80 percent", "20 percent", "36 percent", "125 percent"], "answer": 0, "explanation": "Completion rate is 36 divided by 45 times 100, or 80 percent.", "page": 0, "topic": "Completion rate", "source": "web", "unit": 2, "id": "U2-177"}, {"q": "Which pair is most useful for prioritising user pain points?", "options": ["Persona name and fictional hobby", "Frequency and severity", "Logo colour and font name", "Researcher age and preference"], "answer": 1, "explanation": "Consider both how often a problem occurs and how serious it is.", "page": 0, "topic": "Pain prioritisation", "source": "web", "unit": 2, "id": "U2-178"}, {"q": "A need users do not recognise until a new possibility makes it apparent is called what?", "options": ["A demographic attribute", "A measured conversion rate", "A latent need", "An explicit request"], "answer": 2, "explanation": "Latent needs can remain unrecognised until a possibility reveals them.", "page": 0, "topic": "Latent needs", "source": "web", "unit": 2, "id": "U2-179"}, {"q": "New research contradicts an existing persona’s behaviour description. What should the team do?", "options": ["Preserve it regardless of evidence", "Discard all new findings", "Add invented hobbies to compensate", "Update the persona using the evidence"], "answer": 3, "explanation": "Personas should evolve with research evidence.", "page": 0, "topic": "Persona maintenance", "source": "web", "unit": 2, "id": "U2-180"}, {"q": "What is the primary purpose of ideation?", "options": ["Generate and explore creative solutions", "Approve the first proposal", "Launch a finished product", "Audit financial records"], "answer": 0, "explanation": "Ideation explores creative ideas to solve problems.", "page": 5, "topic": "Ideation", "unit": 3, "id": "U3-001"}, {"q": "Which priority guides early ideation?", "options": ["Quality before any alternatives", "Quantity before quality", "Cost before understanding users", "Implementation before exploration"], "answer": 1, "explanation": "Generating many alternatives precedes evaluation.", "page": 5, "topic": "Ideation", "unit": 3, "id": "U3-002"}, {"q": "Which behavior best supports ideation?", "options": ["Reject unusual suggestions immediately", "Allow only the manager to contribute", "Defer judging new ideas", "Choose the first familiar solution"], "answer": 2, "explanation": "Deferring judgment allows possibilities to develop.", "page": 5, "topic": "Ideation", "unit": 3, "id": "U3-003"}, {"q": "Where is Ideate in the Design Thinking sequence?", "options": ["Before Empathize", "After Test only", "Between Prototype and Test", "After Define and before Prototype"], "answer": tion scores", "Build the release version"], "answer": 0, "explanation": "Clarify gathers information and user needs.", "page": 10, "topic": "Clarify", "unit": 3, "id": "U3-017"}, {"q": "Why ask Why repeatedly during Clarify?", "options": ["Approve a preferred solution", "Find the root cause", "Postpone research", "Score prototypes"], "answer": 1, "explanation": "Repeated Why questions uncover causes.", "page": 10, "topic": "Clarify", "unit": 3, "id": "U3-018"}, {"q": "Which statement best clarifies the deadline problem?", "options": ["Students definitely need voice reminders", "An AI app must be built now", "Students lose track of assignments across courses", "A printed planner is the only solution"], "answer": 2, "explanation": "It describes the difficulty without prescribing a tool.", "page": 10, "topic": "Clarify", "unit": 3, "id": "U3-019"}, {"q": "Which question belongs to CPS Ideate?", "options": ["What is the real problem?", "Which solution works best?", "How can we launch this solution?", "What are all the possible solutions?"], "answer": 3, "explanation": "Ideate explores possible solutions.", "page": 14, "topic": "Ideate", "unit": 3, "id": "U3-020"}, {"q": "Which activity fits CPS Ideate?", "options": ["Build on a teammate's wild suggestion", "Reject costly ideas immediately", "Launch the application", "Conduct final cost comparison"], "answer": 0, "explanation": "Ideate encourages ideas without judgment.", "page": 11, "topic": "Ideate", "unit": 3, "id": "U3-021"}, {"q": "Which listed deadline solution involves collaboration?", "options": ["Private notebook only", "Shared group calendar", "Independent unshared alarm", "Personal printed wall calendar"], "answer": 1, "explanation": "A shared calendar enables collaboration.", "page": 11, "topic": "Ideate", "unit": 3, "id": "U3-022"}, {"q": "Which CPS stage compares advantages and disadvantages?", "options": ["Clarify", "Ideate", "Develop", "Implement"], "answer": 2, "explanation": "Develop analyses and compares generated ideas.", "page": 12, "topic": "Develop", "unit": 3, "id": "U3-023"}, {"q": "What is Develop's main aim?", "options": ["Generate without comparison", "Gather first observations", "Launch without testing", "Identify a practical and valuable solution"], "answer": 3, "explanation": "Develop evaluates and improves alternatives.", "page": 12, "topic": "Develop", "unit": 3, "id": "U3-024"}, {"q": "Which solution wins the CPS matrix example?", "options": ["AI Study Assistant", "Reminder App", "Printed Planner", "Shared group calendar"], "answer": 0, "explanation": "The AI assistant scores 21/25 versus 20 for each alternative.", "page": 12, "topic": "Develop", "unit": 3, "id": "U3-025"}, {"q": "Which criterion gives the Printed Planner its lowest score?", "options": ["Cost", "Innovation", "Ease of use", "Feasibility"], "answer": 1, "explanation": "The planner scores 2 for innovation.", "page": 12, "topic": "Develop", "unit": 3, "id": "U3-026"}, {"q": "What is the AI Study Assistant's worked total?", "options": ["20", "24", "21", "18"], "answer": 2, "explanation": "Its scores 4, 3, 5, 5, 4 sum to 21.", "page": 12, "topic": "Develop", "unit": 3, "id": "U3-027"}, {"q": "Which CPS stage includes testing, feedback, and launch?", "options": ["Clarify", "Ideate", "Develop only", "Implement"], "answer": 3, "explanation": "Implement develops, tests, improves, and launches.", "page": 13, "topic": "Implement", "unit": 3, "id": "U3-028"}, {"q": "What should follow student feedback on a prototype?", "options": ["Improve the solution", "Discard research automatically", "Stop development", "Treat the prototype as final"], "answer": 0, "explanation": "Feedback supports improvement before release.", "page": 13, "topic": "Implement", "unit": 3, "id": "U3-029"}, {"q": "Which question matches CPS Implement?", "options": ["What are all possible solutions?", "How can we make it work in practice?", "What is the actual problem?", "Which unrelated problem comes next?"], "answer": 1, "explanation": "Implement applies the chosen solution.", "page": 14, "topic": "Implement", "unit": 3, "id": "U3-030"}, {"q": "Which mode expands possibilities without judgment?", "options": ["Convergent thinking", "Final approval", "Divergent thinking", "Compliance screening"], "answer": 2, "explanation": "Divergence explores options without evaluation.", "page": 15, "topic": "Thinking modes", "unit": 3, "id": "U3-031"}, {"q": "Which mode narrows alternatives to decide?", "options": ["Divergent thinking", "Free association only", "Unrestricted brainstorming", "Convergent thinking"], "answer": 3, "explanation": "Convergence evaluates and selects.", "page": 15, "topic": "Thinking modes", "unit": 3, "id": "U3-032"}, {"q": "How should divergent and convergent thinking be used?", "options": ["In sequence as separate phases", "Simultaneously for every idea", "Use convergence only", "Use divergence only"], "answer": 0, "explanation": "Generation and evaluation are separated.", "page": 15, "topic": "Thinking modes", "unit": 3, "id": "U3-033"}, {"q": "What is a danger of converging too early?", "options": ["Necessarily producing too many ideas", "Killing promising ideas before exploration", "Removing all costs", "Making testing impossible by definition"], "answer": 1, "explanation": "Early judgment may suppress useful possibilities.", "page": 16, "topic": "Thinking modes", "unit": 3, "id": "U3-034"}, {"q": "What does Yes, and encourage?", "options": ["Accepting only the leader's ideas", "Ending the line of thought", "Accepting a contribution and adding to it", "Scoring before discussion"], "answer": 2, "explanation": "An additive response extends ideas.", "page": 16, "topic": "Brainstorming rules", "unit": 3, "id": "U3-035"}, {"q": "Which response best builds on an idea?", "options": ["No, but that will never work", "That is impossible, stop", "Score it before hearing more", "Yes, and we could add offline access"], "answer": 3, "explanation": "Yes, and keeps exploration open.",
